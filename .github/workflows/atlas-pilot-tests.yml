name: Atlas pilot checks
on:
  push:
    branches: ['atlas-pilot/**']
  pull_request:
    branches: [main, 'atlas-pilot/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas-pilot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Rental, scan and notification checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci --prefix tests
      - run: node scripts/build-pilot.mjs
  browser:
    name: Browser smoke checks (French, Dutch, Arabic)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci --prefix tests
      - run: node --test tests/ci-browser.test.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
