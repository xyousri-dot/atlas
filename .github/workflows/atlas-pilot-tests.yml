name: Atlas pilot checks
on:
  push:
    branches: ['atlas-pilot/**']
  pull_request:
    branches: [main, 'atlas-pilot/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas-pilot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Rental, scan and notification checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci --prefix tests
      - run: node scripts/build-pilot.mjs
  browser:
    name: Browser smoke checks (French, Dutch, Arabic)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci --prefix tests
      - run: node --test tests/ci-browser.test.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: node scripts/build-pilot.mjs
      - run: node --test tests/ci-browser.test.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
          ATLAS_HTML: ${{ github.workspace }}/pilot-dist/index.html
      - run: node --test tests/offline-scan.test.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
          ATLAS_HTML: ${{ github.workspace }}/pilot-dist/index.html
