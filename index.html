function findTextLines(px,W,H){
  var rows=new Array(H), y, x, max=0;
  for(y=0;y<H;y++){ var n=0; for(x=0;x<W;x++) if(px[y*W+x]) n++; rows[y]=n; if(n>max) max=n; }
  if(!max) return [];
  var grens=Math.max(2, max*0.055);
  var raw=[], bezig=false, start=0;
  for(y=0;y<H;y++){
    if(!bezig && rows[y]>grens){ bezig=true; start=y; }
    else if(bezig && rows[y]<=grens){ bezig=false; if(y-start>=6) raw.push([start,y]); }
  }
  if(bezig && H-start>=6) raw.push([start,H]);
  /* een massieve balk of de rand van de kaart is geen tekst */
  var uit=[];
  for(var i=0;i<raw.length;i++){
    var a=raw[i][0], b=raw[i][1], tot=0;
    for(y=a;y<b;y++) tot+=rows[y];
    if(tot/((b-a)*W) < 0.72) uit.push(raw[i]);
  }
  return uit;
}
/* Alle regels van een (rechtgetrokken, zwartwit gemaakte) kaart. */
function kaartRegels(bin){
  if(!SANS) SANS=buildSansSet();
  var W=bin.width, H=bin.height;
  var d=bin.getContext("2d").getImageData(0,0,W,H).data, px=new Uint8Array(W*H);
  for(var k=0,p=0;k<d.length;k+=4,p++) px[p]=d[k]<128?1:0;
  /* De rand van de kaart, een kader of een streep is doorlopende inkt. Dat is geen
     tekst, maar het loopt wel dwars door alle regels heen en plakt ze aan elkaar.
     Een lijn die bijna de hele hoogte of breedte vult halen we daarom eerst weg. */
  var kolom=new Int32Array(W), rij=new Int32Array(H), x, y;
  for(y=0;y<H;y++) for(x=0;x<W;x++) if(px[y*W+x]){ kolom[x]++; rij[y]++; }
  for(x=0;x<W;x++) if(kolom[x]>H*0.5) for(y=0;y<H;y++) px[y*W+x]=0;
  for(y=0;y<H;y++) if(rij[y]>W*0.5) for(x=0;x<W;x++) px[y*W+x]=0;
  var lines=findTextLines(px,W,H);
  if(!lines.length) return [];
  /* Een echte kaart staat vol kleine opdruk; tientallen regels zijn dus normaal.
     We lezen ze, maar niet eindeloos: na een paar honderd tekens is duidelijk dat
     we naar ruis kijken en stoppen we. Zo blijft het onder de seconde. */
  var uit=[], tekens=0;
  for(var i=0;i<lines.length && tekens<1400;i++){
    var h=lines[i][1]-lines[i][0];
    if(h<Math.max(8,H*0.008) || h>H*0.25) continue;
    var r=leesGedrukteRegel(px,W,lines[i][0],lines[i][1]);
    if(!r) continue;
    tekens+=r.tekst.length;
    if(r.tekst.replace(/[^A-Z0-9]/g,"").length>=2) uit.push(r);
  }
  return uit;
}
/* Van foto naar regels: eerst de kaart plat trekken als we zijn hoeken vinden,
   dan zwartwit met licht­correctie, dan lezen. Levert dat weinig op, dan nog een
   poging met een andere drempel. */
function regelsUitBeeld(img,breed){
  var hk=null; try{ hk=vindHoeken(img); }catch(e){ hk=null; }
  var vlak=null;
  if(hk){ try{ vlak=vlakTrekken(img,hk,breed||1800); }catch(e){ vlak=null; } }
  var bron=vlak||img, w=breed||1800;
  /* Twee manieren om zwart van wit te scheiden. Welke wint hangt af van de foto:
     bij schuin licht wint de lichtcorrectie, bij een vlakke scan de vaste drempel.
     We doen ze allebei — het kost een fractie van een seconde — en houden de
     lezing die de meeste leesbare regels oplevert. */
  var sets=[];
  [[0,true],[-18,false],[10,false]].forEach(function(v){
    try{ sets.push(kaartRegels(mrzCanvas(bron,false,0,v[0],null,w,v[1]))); }catch(e){}
  });
  var best=[], bestW=-1;
  sets.forEach(function(s){
    if(!s.length) return;
    var goed=s.filter(function(r){ return r.score>=0.6; }).length;
    var sc=goed*2+s.length;
    if(sc>bestW){ bestW=sc; best=s; }
  });
  return best;
}
/* Wat we uit die regels halen mag alleen iets zijn dat er als een nummer of een
   datum uitziet. Een gok vullen we niet in — we laten de foto zien. */
/* Een 5 en een S lijken op elkaar, en een 0 en een O. In een datum of een nummer
   hoort geen letter, dus daar mogen we die verwarring rechtzetten — precies zoals
   bij de machineleesbare strook. De vorm van het patroon en een controle op
   redelijke waarden bewaken dat er niets verzonnen wordt. */
var NAARCIJFER={O:"0",D:"0",Q:"0",U:"0",C:"0",J:"1",I:"1",L:"1",T:"7",Y:"7",S:"5",B:"8",E:"8",G:"6",Z:"2",A:"4"};
function cijferig(s){ return String(s).replace(/[A-Z]/g,function(c){ return NAARCIJFER[c]||c; }); }
function datumsUit(tekst){
  var uit=[], m, re=/([0-3]?\d)\s*[\.\/\-\s]\s*([01]?\d)\s*[\.\/\-\s]\s*((?:19|20)\d\d)/g;
  while((m=re.exec(tekst))){
    var dag=Number(m[1]), maand=Number(m[2]), jaar=Number(m[3]);
    if(dag<1||dag>31||maand<1||maand>12) continue;
    /* Een dag van één cijfer met vlak ervoor een onleesbaar teken of een letter:
       dat teken was waarschijnlijk het eerste cijfer van de dag ("?5/09/2032" is
       eerder 15 dan 5). Liever geen datum dan een verkeerde. */
    if(m[1].length===1 && /[?A-Z0-9]/.test(tekst.charAt(m.index-1))) continue;
    uit.push({ iso:jaar+"-"+("0"+maand).slice(-2)+"-"+("0"+dag).slice(-2), jaar:jaar });
  }
  return uit;
}
/* Het nummer zoeken we per regel en nooit midden in een zin: een rijbewijsnummer
   stáát op zijn eigen regel, achter het veldnummer. Een regel waar een datum in
   staat slaan we over — anders wordt een geboortedatum een "nummer". */
/* Het nummer hoeft niet de hele regel te zijn. Op een echte kaart staat er van alles
   omheen — een veldcode, een streepje, wat ruis. We zoeken hem dus binnenin, maar
   eisen dat er links en rechts geen cijfer tegenaan plakt. */
function nummerInRegel(s,ruw){
  /* De cijfers vóór de streep moeten écht als cijfers gelezen zijn — niet een
     "Zz" die via de cijfertabel "22" werd. Daarom kijken we ook in de ruwe regel. */
  var m=s.match(/(^|[^0-9A-Z])([0-9]{1,3})\s*\/\s*([0-9]{5,8})($|[^0-9A-Z])/);
  if(!m) return "";
  if(ruw!==undefined){
    var r=String(ruw);
    var mr=r.match(/(^|[^0-9A-Z])([0-9]{1,3})\s*\/\s*([0-9A-Z]{5,8})($|[^0-9A-Z])/);
    if(!mr || mr[2]!==m[2]) return "";
  }
  return m[2]+"/"+m[3];
}
function licNummerUit(regels){
  var strak=[], los=[], cijfer=[], i;
  for(i=0;i<regels.length;i++){
    var s=regels[i].tekst;
    if(datumsUit(s).length || datumsUit(cijferig(s)).length) continue;
    var body=s.replace(/^[0-9A-Z?]{1,3}\s*[\.\)]\s*/,"").replace(/^[0-9A-Z?]{1,3}\s+/,"").trim();
    if(body.length>=6 && body.length<=16){
      var m=body.match(/^(\d{1,3})\s*\/\s*(\d{5,8})$/);
      if(m){ strak.push(m[1]+"/"+m[2]); continue; }
      var c=cijferig(body);
      m=c.match(/^(\d{1,3})\s*[\/?|]{1,2}\s*(\d{5,8})$/);
      if(m){ strak.push(m[1]+"/"+m[2]); continue; }
      m=body.match(/^([A-Z]{1,2})\s?(\d{5,8})$/);
      if(m){ strak.push(m[1]+m[2]); continue; }
    }
    /* tweede kans: het nummer staat ergens ín de regel, met ruis eromheen */
    var n2=nummerInRegel(cijferig(s),s);
    if(n2) los.push(n2);
  }
  /* derde kans: de cijferlezing van dezelfde regel. Daarin kan een S geen 5 worden,
     maar een letter wordt er ook altijd een cijfer — daarom pas als laatste. */
  if(!strak.length && !los.length){
    for(i=0;i<regels.length;i++){
      var cc=regels[i].cijfers||"";
      if(!cc || datumsUit(cc).length) continue;
      var n3=nummerInRegel(cc,regels[i].tekst);
      if(n3) cijfer.push(n3);
    }
  }
  var kand = strak.length ? strak : (los.length ? los : cijfer);
  if(!kand.length) return "";
  var tel={}, beste=kand[0];
  kand.forEach(function(k){ tel[k]=(tel[k]||0)+1; if(tel[k]>tel[beste]) beste=k; });
  /* Kwam hetzelfde nummer meer dan eens uit deze foto, dan is dat een bevestiging. */
  return { nummer:beste, hard:tel[beste]>=2 };
}
/* Het rijbewijs: nummer, vervaldatum, geboortedatum en zo mogelijk de naam. */
function rijbewijsUitRegels(regels){
  var tekst=regels.map(function(r){ return r.tekst; }).join("\n");
  var plat=tekst.replace(/\n/g," "), cijf=cijferig(plat);
  /* de cijferlezing van elke regel erbij: daar staan datums het zuiverst in */
  var cijfRegels=regels.map(function(r){ return r.cijfers||""; }).join(" ");
  var o={ regels:regels, tekst:tekst }, nu=new Date().getUTCFullYear();
  var nr=licNummerUit(regels);
  if(nr && nr.nummer){ o.number=nr.nummer; o.numberHard=!!nr.hard; }
  var ds=datumsUit(plat).concat(datumsUit(cijf));
  if(!ds.length) ds=datumsUit(cijfRegels);
  var zien={}; ds=ds.filter(function(d){ if(zien[d.iso]) return false; zien[d.iso]=1; return true; });
  var later=ds.filter(function(d){ return d.jaar>=nu-1 && d.jaar<=nu+40; });
  var vroeg=ds.filter(function(d){ return d.jaar<=nu-16 && d.jaar>=nu-100; });
  /* Een rijbewijs of kaart is hooguit een jaar of vijftien geldig. Een "vervaldatum"
     verder weg komt van een verkeerd gelezen cijfer (26/07/2018 wordt zo 2048) en
     hoort niet op het contract. Liever leeg dan fout. */
  later=later.filter(function(d){ return d.jaar<=nu+15; });
  if(later.length) o.expiry=later.sort(function(a,b){ return b.jaar-a.jaar; })[0].iso;
  if(vroeg.length) o.birth=vroeg.sort(function(a,b){ return a.jaar-b.jaar; })[0].iso;
  /* Namen op een permis staan bij 1. en 2.; verder staat er vooral opdruk van de
     staat. Die woorden kennen we, dus die vallen af. */
  /* De opdruk van de kaart is geen naam. Vooral de achterkant staat er vol mee:
     "Catégories", "Date de délivrance", "Fin de validité", "Duplicata",
     "Restrictions". Zonder deze lijst belandt zo'n kop in het naamveld. */
  var stop=/ROYAUME|MAROC|MAROCAIN|PERMIS|CONDUIRE|CARTE|NATIONALE|IDENTITE|KINGDOM|DRIVING|LICENCE|LICENSE|MINISTERE|TRANSPORT|CATEGOR|DELIVRANCE|VALIDITE|VALIDIT|DUPLICATA|RESTRICTION|NAISSANCE|PRENOM|SIGNE|DIRECTEUR|AGENCE|SECURITE|ROUTIERE|NATIONAL/;
  var namen=regels.filter(function(r){
    var s=r.tekst.replace(/^[0-9]{1,2}\s*[\.\)]\s*/,"").trim();
    /* Een naam op een rijbewijs staat op zijn eigen regel en is één of twee
       woorden. Een regel van vier woorden is een kop of een zin, geen naam. */
    return /^[A-Z][A-Z\s\-]{2,28}$/.test(s) && !stop.test(s) && s.replace(/\s/g,"").length>=3
           && s.split(/\s+/).length<=2;
  }).map(function(r){ return r.tekst.replace(/^[0-9]{1,2}\s*[\.\)]\s*/,"").trim(); });
  if(namen.length) o.namen=namen.slice(0,4);
  return o;
}
/* ============ DE KAART PLATLEGGEN ============
   Zo werken de professionele lezers: eerst het document vinden, dan het scheve
   vlak rechttrekken naar een vaste maat, en pas daarna lezen. Een kaart die plat
   en op ware verhouding voor je ligt heeft zijn regels altijd op dezelfde plek —
   onderaan. Dan hoeft de lezer niet meer tientallen varianten te proberen: hij
   kijkt gewoon op de juiste plek. Dat is sneller én betrouwbaarder dan raden.
   Een identiteitskaart en een rijbewijs hebben dezelfde maat als een bankpas
   (85,6 × 54 mm, verhouding 1,585). Die verhouding is de controle: komt het
   gevonden vlak daar niet in de buurt, dan was het de kaart niet. */
var KAARTVERH=85.6/54;
function kaartVlak(img,bw){
  bw=bw||1800;
  var hk=null; try{ hk=vindHoeken(img); }catch(e){ hk=null; }
  if(!hk) return null;
  var cv=null; try{ cv=vlakTrekken(img,hk,bw); }catch(e){ cv=null; }
  if(!cv) return null;
  /* Staand gevonden? Dan ligt de kaart gekanteld in beeld; rechtop zetten. */
  if(cv.height>cv.width) cv=turnImage(cv,90);
  var v=cv.width/Math.max(1,cv.height);
  if(v<KAARTVERH*0.80 || v>KAARTVERH*1.20) return null;
  return cv;
}
/* Een band uit de platgelegde kaart: van boven- tot onderkant in delen van de
   hoogte. De strook van een identiteitskaart zit onderaan, de regel van een
   rijbewijs ook. */
function kaartBand(cv,van,tot,bw){
  var y0=Math.round(cv.height*van), y1=Math.round(cv.height*tot);
  var h=Math.max(20,y1-y0), sc=(bw||2200)/cv.width;
  var c=document.createElement("canvas");
  c.width=Math.round(cv.width*sc); c.height=Math.round(h*sc);
  var x=c.getContext("2d"); x.imageSmoothingEnabled=true; x.imageSmoothingQuality="high";
  x.drawImage(cv,0,y0,cv.width,h,0,0,c.width,c.height);
  return c;
}
/* ============ DE OCR-B-REGEL OP DE ACHTERKANT VAN HET RIJBEWIJS ============
   Het Marokkaanse rijbewijs draagt achterop, langs de lange rand, één regel in
   OCR-B: D1 + land + nummer + afgiftedatum + naam + controlecijfer. Die regel is
   het enige op de kaart met een controlecijfer, dus dáár halen we het nummer
   vandaan. Hij staat altijd langs een lange rand; welke, en welke kant boven, weten
   we niet — dus knippen we alle randstroken uit en lezen die in beide richtingen. */
/* Een telefoonfoto is vier keer zo groot als nodig. De regel achterop beslaat twee
   derde van de kaartbreedte: op een beeld van tweeduizend punten breed is elk
   lettertje nog ruim veertig punten hoog — meer dan genoeg. Kleiner werken maakt
   elke stap vier keer zo goedkoop, en dát is het verschil tussen "leest hem" en
   "tijd op" op een gewone laptop. */
function kleinerBeeld(img,maxB){
  var b=maxB||2000;
  if(img.width<=b) return img;
  var c=document.createElement("canvas"), sc=b/img.width;
  c.width=b; c.height=Math.round(img.height*sc);
  var x=c.getContext("2d"); x.imageSmoothingEnabled=true; x.imageSmoothingQuality="high";
  x.drawImage(img,0,0,c.width,c.height);
  return c;
}
function licStroken(img){
  img=kleinerBeeld(img,2000);
  var uitVlak=[];
  /* De regel staat op de achterkant langs de onderrand. Ligt de kaart eenmaal
     plat, dan is dat één vaste band — twee lezingen in plaats van zestien. */
  var pv=null; try{ pv=kaartVlak(img,1800); }catch(e){ pv=null; }
  if(pv){
    var ond=kaartBand(pv,0.78,1.0,2200);
    uitVlak.push(ond, turnImage(ond,180));
  }
  var rect=null; try{ rect=vindKaart(img); }catch(e){ rect=null; }
  var kaart = rect ? snijUit(img,rect,2200) : img;
  var W=kaart.width, H=kaart.height, out=[];
  function deel(x,y,w,h){ var c=document.createElement("canvas"); c.width=w; c.height=h;
    c.getContext("2d").drawImage(kaart,x,y,w,h,0,0,w,h); return c; }
  if(W>H*4){ return uitVlak.concat([kaart,turnImage(kaart,180)]); }   /* een strak kader om de regel zelf */
  if(H>W){
    var sw=Math.round(W*0.17), li=deel(0,0,sw,H), re=deel(W-sw,0,sw,H);
    out.push(turnImage(li,90),turnImage(re,270),turnImage(li,270),turnImage(re,90));
  } else {
    var sh=Math.round(H*0.17), bo=deel(0,0,W,sh), on=deel(0,H-sh,W,sh);
    out.push(on,turnImage(bo,180),bo,turnImage(on,180));
  }
  return uitVlak.concat(out);
}
/* Een randstrook bevat behalve de regel ook de donkere tafel naast de kaart en de
   lijnen van de tabel. Die zijn lange aaneengesloten zwarte banen; letters zijn
   dat nooit. Wat te lang is halen we weg — daarna ziet de regelzoeker alleen tekst. */
function zonderBanen(cv){
  var W=cv.width, H=cv.height, x=cv.getContext("2d"), d=x.getImageData(0,0,W,H), a=d.data;
  var maxH=Math.max(20,Math.round(W*0.02)), maxV=Math.max(24,Math.round(H*0.45)), xx, y, run, k;
  for(y=0;y<H;y++){ run=0;
    for(xx=0;xx<=W;xx++){ var ink = xx<W && a[(y*W+xx)*4]<128;
      if(ink) run++; else { if(run>maxH) for(k=xx-run;k<xx;k++) a[(y*W+k)*4]=a[(y*W+k)*4+1]=a[(y*W+k)*4+2]=255; run=0; } } }
  for(xx=0;xx<W;xx++){ run=0;
    for(y=0;y<=H;y++){ var ink2 = y<H && a[(y*W+xx)*4]<128;
      if(ink2) run++; else { if(run>maxV) for(k=y-run;k<y;k++) a[(k*W+xx)*4]=a[(k*W+xx)*4+1]=a[(k*W+xx)*4+2]=255; run=0; } } }
  x.putImageData(d,0,0); return cv;
}
async function licRegelUitBeeld(img,budget,D){
  var t0=Date.now(), max=budget||20000, stroken=licStroken(img), stem={}, eerste={}, n=0, adem=ademHaler();
  var combos=[[0,2200,false],[-20,2200,false],[0,2200,true],[10,1800,false]];
  /* De kaart ligt zelden precies recht; een graad scheef over een hele kaartlengte
     is al een halve letterhoogte. Per strook dus eerst de hoek bepalen. */
  var hoeken=[];
  function hoekVan(si){
    if(hoeken[si]===undefined){
      try{ hoeken[si]=deskewAngle(zonderBanen(mrzCanvas(stroken[si],false,0,0,null,900,false))); }catch(e){ hoeken[si]=0; }
    }
    return hoeken[si];
  }
  for(var ci=0;ci<combos.length;ci++){
    for(var si=0;si<stroken.length;si++){
      if(Date.now()-t0>max) break;
      await adem(); n++;
      var hit=null;
      try{ hit=mrzFromCanvas(zonderBanen(mrzCanvas(stroken[si],false,hoekVan(si),combos[ci][0],null,combos[ci][1],combos[ci][2]))); }catch(e){ hit=null; }
      if(!hit || hit.kind!=="licence") continue;
      stem[hit.docNumber]=(stem[hit.docNumber]||0)+1;
      if(!eerste[hit.docNumber]) eerste[hit.docNumber]=hit;
      if(stem[hit.docNumber]>=2){ hit=eerste[hit.docNumber]; hit.sure=true; if(D) D.licRegel=n+" pogingen, 2× gelijk"; return hit; }
    }
  }
  var k=Object.keys(stem);
  if(D) D.licRegel=n+" pogingen, "+(k.length?"1× gelezen":"niets");
  if(!k.length) return null;
  return null;   /* één lezing is bij één controlecijfer niet genoeg */
}
/* Eén foto, meerdere lezingen. Het beeld wordt op verschillende manieren
   klaargemaakt — groter, anders belicht, rechtgedraaid — en elke lezing mag
   stemmen. Wat het vaakst gelezen wordt wint. Zo hangt de uitkomst niet af van
   het toeval van één instelling, en een enkele misser haalt het niet. */
/* Lezen kost rekenwerk, en rekenwerk in de browser bevriest het scherm als je het
   in één ruk doet. Daarom geven we tussen elke poging het scherm even terug: de
   verhuurder ziet de app leven in plaats van een vastgelopen pagina. */
async function rijbewijsUitBeeld(img,budget,D,melden){
  var t0=Date.now(), max=budget||5000, adem=ademHaler();
  var hk=null; try{ hk=vindHoeken(img); }catch(e){ hk=null; }
  var vlak=null; if(hk){ try{ vlak=vlakTrekken(img,hk,2200); }catch(e){ vlak=null; } }
  /* De hoeken van de kaart kunnen misgrepen zijn — op een drukke achtergrond gebeurt
     dat. Daarom lezen we altijd óók de foto zoals hij is: dan hangt het niet af van
     één geslaagde stap. */
  var bronnen=[];
  /* Eerst de kaart uit de foto knippen: dat is de stap die het verschil maakt
     tussen "de tafel lezen" en "de kaart lezen". Ligt hij staand in beeld, dan
     zetten we hem meteen rechtop. */
  var rect=null; try{ rect=vindKaart(img); }catch(e){ rect=null; }
  var knip=null;
  if(rect){
    knip=snijUit(img,rect,2200);
    /* Staand in beeld: welke kant boven is weten we niet, dus proberen we beide. */
    if(rect.staand){ bronnen.push({n:"kaart 90°",c:turnImage(knip,90)});
                     bronnen.push({n:"kaart 270°",c:turnImage(knip,270)}); }
    else bronnen.push({n:"kaart",c:knip});
  }
  /* Een rijbewijs is liggend. Een staande foto zonder gevonden kaart bevat hem dus
     gekanteld — en gekantelde tekst leest als een rij streepjes. */
  function liggend(c,n){
    if(c.height>c.width*1.15) return [{n:n+" 90\u00b0",c:turnImage(c,90)},{n:n+" 270\u00b0",c:turnImage(c,270)}];
    return [{n:n,c:c}];

function fillFromMRZ(hit,storedKey){

     identiteitskaart over. */

    renameScan(storedKey,"licence"); markCheck("cvLic"); hit.noNumber=false; return;

  if(hit.fullName) $("cvName").value=hit.fullName;
  if(hit.birthDate) $("cvBirth").value=hit.birthDate;
  /* De nationaliteit staat in de strook en zit in de totaalcontrole. Wat er eerder
     in het vakje stond — van een vorige poging of een voorbeeld — moet daarvoor
     wijken; anders blijft er een verkeerd land staan bij de juiste persoon. */
  if(hit.nationality && echtLand(hit.nationality)) $("cvNat").value=hit.nationality;

    if(hit.expiry) $("cvLicExp").value=hit.expiry;

       cijfers. Die vorm is hier de controle — haalt hij die, dan vullen we hem in
       ook als de lezing verder niet bevestigd is, want anders staat het veld altijd
       leeg terwijl het nummer er gewoon staat. */
    var uitVorm = usableDocNo(pickedDoc(),"",hit.altNumber,hit.kind);

     als paspoort in het dossier. */
  /* De strook weet zelf wat voor document het is: een paspoort begint met P, een
     kaart met I. We zetten het keuzeveld daarop en hoeven de verhuurder niets te
     vragen. */
  if(pickedDoc()!=="licence" && hit.kind){

    renameScan(storedKey,soort);

/* Elke foto krijgt eerst een eigen sleutel, zodat een tweede document nooit het eerste wist.
   Achteraf verhuist hij naar zijn soort (cin / passport / licence), of daarnaast als dat al bezet is. */
function renameScan(from,to){
  if(!from || !clientDraft || !clientDraft.scans[from]) return to;
  if(from===to) return to;
  var key=to, n=2;
  while(clientDraft.scans[key]) key=to+"-"+(n++);
  clientDraft.scans[key]=clientDraft.scans[from]; delete clientDraft.scans[from];
  return key;
}

/* ============ ZELF DE REGELS AANDUIDEN ============
   Lukt het automatisch zoeken niet — een kaart in de hand, schuin, regels klein in beeld —
   dan sleep je zelf een kader om de twee of drie regels. Dan krijgt de lezer precies
   wat hij nodig heeft: de strook groot en alleen. */
var CROPIMG=null, CROPKEY=null, cropSel=null;

   gebruiker mag het altijd verslepen. Dat is de garantie dat er nooit iets in de weg
   staat — ligt er een blad papier naast de kaart, of pakt de app de verkeerde vlek,
   dan trek je er zelf een kader omheen en klaar. */
function tekenKader(){
  var s=$("cropSel"), cv=$("cropCv");
  if(!cropSel || !CROPIMG){ s.style.display="none"; return; }
  var f=cv.width/CROPIMG.width;
  var cr=cv.getBoundingClientRect(), pr=cv.parentNode.getBoundingClientRect();
  s.style.display="block";
  s.style.left=(cropSel.x*f+(cr.left-pr.left))+"px";
  s.style.top=(cropSel.y*f+(cr.top-pr.top))+"px";
  s.style.width=(cropSel.w*f)+"px";
  s.style.height=(cropSel.h*f)+"px";
}
function showCrop(blob,storedKey,deel){

    cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    /* kader alvast leggen waar de kaart lijkt te liggen — of, als de strook al half
       gelezen is, op het onderste deel van de kaart waar de strook zit */
    var r=null; try{ r=vindKaart(img); }catch(e){ r=null; }
    /* een kleine vlek (een vinger, een lichte plek) is niet de kaart: dan de hele foto */
    if(!r || r.w<40 || r.h<20 || r.w*r.h < img.width*img.height*0.45) r={x:0,y:0,w:img.width,h:img.height};
    if(deel==="strook") cropSel={x:r.x,y:Math.round(r.y+r.h*0.4),w:r.w,h:Math.round(r.h*0.6)};

   De tekstherkenning van Apple (Live Text) en die van Android lezen een kaart beter
   dan wat ik in een webpagina kan bouwen — ze zitten in het toestel zelf en zijn er
   jaren op getraind, ook op Arabisch. Aanroepen vanuit een webpagina kan niet, maar

     controlecijfer bevestigd is, blijft staan. */

  if(hit && hit.kind==="licence"){
    if(!vastLic){ $("cvLic").value=hit.docNumber; zetVast("cvLic"); markCheck("cvLic"); gedaan.push(t.pLic); }
    if(hit.nationality && echtLand(hit.nationality) && !$("cvNat").value) $("cvNat").value=hit.nationality;
    hit=null;
  }

    if(hit.fullName){ $("cvName").value=hit.fullName; gedaan.push(t.pName); }
    if(hit.birthDate){ $("cvBirth").value=hit.birthDate; gedaan.push(t.pBirth); }
    if(hit.nationality && echtLand(hit.nationality)){ $("cvNat").value=hit.nationality; gedaan.push(t.pNat); }

  if(!hit && soort==="id"){
    var vk=voorkantUitRegels(regels);
    if(vk.birth && !$("cvBirth").value){ $("cvBirth").value=vk.birth; gedaan.push(t.pBirth); }
    if(vk.expiry && !$("cvDocExp").value){ $("cvDocExp").value=vk.expiry; gedaan.push(t.pExp); }
    if(vk.number && !$("cvDocNo").value){ $("cvDocNo").value=vk.number; gedaan.push(t.pDoc); markCheck("cvDocNo"); }
    if(vk.name && !$("cvName").value){ $("cvName").value=vk.name; gedaan.push(t.pName); }
    if(pickedDoc()==="licence") setPick("cin");

  if(!hit && soort==="licence"){
    var g=rijbewijsUitRegels(regels);

    if(g.expiry && !$("cvLicExp").value){ $("cvLicExp").value=g.expiry; gedaan.push(t.pLicExp); }
    if(g.birth && !$("cvBirth").value){ $("cvBirth").value=g.birth; gedaan.push(t.pBirth); }
    if(g.namen && g.namen.length && !$("cvName").value){ $("cvName").value=g.namen.slice(0,2).join(" "); gedaan.push(t.pName); }
    markCheck("cvLic");

     nummer dat uit ruis komt is erger dan een leeg vak. */
  /* Het adres staat nooit in de strook; wel vaak in de geplakte tekst. */
  if(!$("cvAddr").value && pickedDoc()!=="licence"){

    if(adr){ $("cvAddr").value=adr; markCheck("cvAddr"); gedaan.push(t.pAddr); }
  }
  return gedaan;
}

/* ============ ECHTE TEKSTHERKENNING ============
   Buiten de zandbak van claude.ai kan de app doen wat professionele scanners doen:
   een volwaardige tekstherkenner laden (Tesseract, gratis, in de browser) en als
   tweede mening een dienst aanroepen (OCR.space, gratis sleutel). Wij doen wat wij
   het best kunnen — de kaart uitknippen, rechtdraaien, vergroten — en zij lezen de
   letters. Wat terugkomt gaat door dezelfde controles als geplakte tekst. */

  else {

    c.getContext("2d").drawImage(basis,0,0,c.width,c.height);
    uit.push(c);

/* Grijs maken en het contrast oprekken: het donkerste procent wordt zwart, het
   lichtste wit. Tesseract houdt daarvan. */
function contrastGrijs(c){
  var k=document.createElement("canvas"); k.width=c.width; k.height=c.height;
  var x=k.getContext("2d"); x.drawImage(c,0,0);

  tel=0; for(i=255;i>=0;i--){ tel+=hist[i]; if(tel>N*0.01){ hi=i; break; } }
  var span=Math.max(1,hi-lo);
  for(i=0;i<a.length;i+=4){ g=Math.max(0,Math.min(255,Math.round((a[i]-lo)*255/span))); a[i]=a[i+1]=a[i+2]=g; }

/* WELK DOCUMENT IS DIT?
   Het vakje waarin de foto belandt is een hint, geen waarheid. Wat er werkelijk op
   de kaart staat beslist waar de gegevens heen gaan. Anders komt de vervaldatum van

function voorkantUitRegels(regels){
  var o={}, lijst=regels.map(function(r){ return r.tekst; }), i;

    if(m && !o.birth){ var d=datumsUit(m[1])[0]; if(d && d.jaar<=nu-16) o.birth=d.iso;

      var namen=[];
      for(var k=i-1;k>=0 && namen.length<2;k--){
        var q=lijst[k].replace(/[^A-Z\s\-]/g,"").replace(/\s+/g," ").trim();

    var v=r.match(/VALABLE\s*JUSQU.{0,4}\s*([0-3]?\d[\.\/\-][01]?\d[\.\/\-](?:19|20)\d\d)/i);

  if(/PERMIS|CONDUIRE|DRIVING|LICEN[CS]E/.test(t)) lic+=3;
  if(/CATEGOR|CLASSE/.test(t)) lic+=1;
  if(/CARTE\s*NATIONAL|IDENTIT|CNIE|BITAQA|PASSEPORT|PASSPORT/.test(t)) id+=3;
  if(/<<</.test(t)) id+=3;                               /* de strook zelf in beeld */
  if(/\bIDMAR|\bID[A-Z]{3}[A-Z0-9]/.test(t)) id+=3;

function askCancel(r){

/* ============ WAGENPARK ============ */
function carPL(c){
  var rents=RENTALS.filter(function(r){ return live(r) && r.vehicleId===c.id && r.depart; });
  /* Opbrengst is wat er binnenkwam, niet wat er afgesproken werd. Anders zegt
     dit scherm iets anders dan de kas, en dan klopt er ergens iets niet. */
  var all=RENTALS.filter(function(r){ return r.vehicleId===c.id; });
  /* Bij een lopende verhuur is de borg geen omzet. Bij een geannuleerde is wat
     je van de borg mocht houden dat wel. */
  var rev=all.reduce(function(a,r){ return a+paidRent(r)+(r.cancelled?paidCaution(r):0); },0);
  var due=all.filter(live).reduce(function(a,r){ return a+dueRent(r); },0);
  var days=rents.reduce(function(a,r){ return a+(r.days||0); },0);
  var ex=EXP.filter(function(e){ return e.vehicleId===c.id; });
  var cost=ex.reduce(function(a,e){ return a+(e.amount||0); },0);
  var since=c.purchaseDate?Math.max(1,dayDiff(c.purchaseDate,today())):null;
  return { rev:rev, due:due, cost:cost, net:rev-cost, days:days, util: since?Math.round(days/since*100):null, loanLeft:(c.loanMonthly||0)*(c.loanMonthsLeft||0), ex:ex };
}
function renderFleet(){

    /* Op een nieuw toestel staat de wagenpark leeg, want alles zit in de opslag

/* ============ BIBLIOTHEKEN: nooit afhankelijk van één adres ============
   Elke bibliotheek heeft meerdere bronnen. Werkt de eerste niet, dan de volgende.
   Pas geladen wanneer een functie ze echt nodig heeft. */
function loadScript(src){
  return new Promise(function(res,rej){
    var s=document.createElement("script"); s.src=src; s.async=true;
    s.onload=function(){ res(true); }; s.onerror=function(){ rej(new Error("load")); };
    setTimeout(function(){ rej(new Error("timeout")); },7000);
    document.head.appendChild(s);
  });
}

var LIBTRIED={};
async function needLib(k){
  var L=LIBS[k]; if(!L) return false;
  if(L.has()) return true;
  for(var i=0;i<L.urls.length;i++){
    try{ await loadScript(L.urls[i]); }catch(e){}

/* Een klant stuurt zelden een nette foto. Vaak is het een PDF van een scanner, of
   een pagina uit een e-mail. We zetten elke bladzijde om in een scherp beeld en
   behandelen die verder als een gewone foto: dezelfde lezer, dezelfde controles. */
function isPdf(file){
  return !!file && ((file.type||"").indexOf("pdf")>=0 || /\.pdf$/i.test(file.name||""));
}
async function pdfPages(file,max){
  if(!await needLib("pdfread")) return [];
  try{
    if(window.pdfjsLib.GlobalWorkerOptions) window.pdfjsLib.GlobalWorkerOptions.workerSrc="";
  }catch(e){}
  var buf=await file.arrayBuffer();
  var doc=await window.pdfjsLib.getDocument({ data:buf, disableWorker:true, isEvalSupported:false }).promise;
  var out=[], n=Math.min(doc.numPages,max||3);
  for(var i=1;i<=n;i++){
    var page=await doc.getPage(i);
    /* groot genoeg renderen: de regels onderaan een identiteitskaart zijn klein */
    var v1=page.getViewport({scale:1});
    var scale=Math.min(4,Math.max(2,2200/Math.max(v1.width,v1.height)));
    var vp=page.getViewport({scale:scale});
    var cv=document.createElement("canvas"); cv.width=Math.round(vp.width); cv.height=Math.round(vp.height);
    await page.render({ canvasContext:cv.getContext("2d"), viewport:vp }).promise;
    out.push(await new Promise(function(r){ cv.toBlob(function(b){ r(b); },"image/jpeg",0.92); }));
  }
  return out;
}
/* ============ GEWONE TEKST LEZEN ============
   De machineleesbare strook lees ik zelf: vaste vakjes, 37 tekens, controlecijfers.
   Gedrukte tekst — een adres, een rijbewijsnummer — is een heel ander vak: evenredige
   letters, geen vaste breedte, geen controle. Daar halen we een echte tekstherkenner
   bij. Die wordt pas gedownload als de verhuurder erom vraagt, want het is een flink
   bestand; daarna zit hij in de browser en gaat het snel. Lukt het laden niet, dan
   zeggen we dat en blijft het veld gewoon leeg. */
var OCRW=null, OCRBEZIG=false, OCRFOUT="";
async function ocrWorker(melden){
  if(OCRW) return OCRW;
  if(!await needLib("ocr")){ OCRFOUT="tesseract niet geladen"; return null; }
  var T=window.Tesseract;
  var opt={ logger:function(m){ if(melden && m && m.status) melden(m.status, m.progress||0); } };
  /* Tesseract 5: createWorker(taal, motor, opties). De oude vorm createWorker(opties)
     bestaat nog in versie 4 — daarom proberen we eerst de nieuwe en dan de oude.
     (Op function.length afgaan werkt niet: standaardwaarden tellen niet mee.) */
  /* Frans erbij: de opdruk op een Marokkaanse kaart is Frans ("Né le", "Valable
     jusqu'au"). Lukt dat pakket niet te laden, dan alleen Engels. */
  try{ OCRW=await T.createWorker("fra+eng",1,opt); return OCRW; }catch(e0){}
  try{ OCRW=await T.createWorker("eng",1,opt); return OCRW; }catch(e1){}
  try{
    OCRW=await T.createWorker(opt);
    await OCRW.loadLanguage("eng"); await OCRW.initialize("eng");
    return OCRW;
  }catch(e2){ OCRFOUT="tesseract start mislukt: "+String((e2&&e2.message)||e2); OCRW=null; return null; }
}
async function ocrLees(canvas,melden,witlijst){
  var w=await ocrWorker(melden); if(!w) return null;
  try{
    /* De tekenlijst geldt voor de hele werker en blijft staan tot je hem weghaalt.
       Zetten we hem voor de strook (alleen hoofdletters en « < »), dan leest de
       volgende oproep — het adres — ineens zonder spaties. Dus: elke keer expliciet
       zetten, ook als we hem niet nodig hebben. */
    if(w.setParameters) { try{ await w.setParameters({ tessedit_char_whitelist: witlijst||"" }); }catch(e){} }
    var r=await w.recognize(canvas);
    return (r&&r.data&&typeof r.data.text==="string") ? r.data.text : "";
  }catch(e){ OCRFOUT="tesseract lezen mislukt: "+String((e&&e.message)||e); return null; }
}
/* Hetzelfde voor de regels die onze eigen lezer vond: welke regel lijkt op een adres? */
/* Een adres is straatnaam plus nummer. Losse letters, streepjes en vraagtekens zijn
   geen adres — dat vullen we dus niet in. */
var ADRESSTERK=/\b(RUE|AV|AVENUE|BD|BOULEVARD|LOT|IMM|APPT|APT|RES|RTE|ZNK|LOTISSEMENT|HAY|QUARTIER|RESIDENCE|IMMEUBLE|APPARTEMENT|ETAGE|DOUAR|BLOC|SECTEUR|CITE|VILLA|DERB|ZANKAT|CHARIA|TARIK|ROUTE|MEDINA|OPERATION|ANGLE|PLACE|CENTRE)\b/;
var ADRESWOORD=/\b(RUE|AV|AVENUE|BD|BOULEVARD|LOT|LOTISSEMENT|LOTS|HAY|QUARTIER|QU|RESIDENCE|RES|IMM|IMMEUBLE|APPT|APT|APPARTEMENT|ETAGE|ETG|N[°O]?|NR|DOUAR|BLOC|SECTEUR|CITE|VILLA|DERB|ZANKAT|CHARIA|TARIK|ROUTE|RTE|KM|CENTRE|VILLE|MEDINA|OPERATION|OP|ANGLE|PLACE|PL)\b/;
function adresAchtig(t){
  if(!t) return false;
  var s=String(t).trim().toUpperCase();
  /* een adres bevat vrijwel altijd een straat- of wijkwoord; zonder dat is het
     losse tekst die toevallig een cijfer bevat */
  if(!ADRESWOORD.test(s)) return false;
  /* "N°", "NR", "KM" en dergelijke zijn te kort om op zichzelf een adres te
     bewijzen — die staan zo in elke verkeerd gelezen regel. Er moet minstens één
     écht adreswoord bij staan. */
  if(!ADRESSTERK.test(s)) return false;
  /* Losse letters tussen de woorden ("= G 76 IG I MOINS") zijn leesfouten, geen
     adres. Het grootste deel van de tekst moet uit echte woorden bestaan. */
  var los=(s.match(/(^|\s)[A-Z0-9](\s|$)/g)||[]).length;
  if(los>2) return false;
  if(/[=_|\\\/]/.test(s)) return false;
  if(s.length<10 || s.length>70) return false;
  var vraag=(s.match(/\?/g)||[]).length; if(vraag>s.length*0.08) return false;
  var letters=(s.match(/[A-Z]/g)||[]).length; if(letters<8) return false;
  if(!/[A-Z]{4,}/.test(s)) return false;          /* minstens één echt woord */
  if(!/\d/.test(s)) return false;                 /* en een huisnummer */
  var woorden=s.split(/\s+/).filter(function(w){ return /^[A-Z]{3,}$/.test(w); });
  if(woorden.length<2) return false;
  /* en minstens twee woorden van vier letters: drieletterige stukjes zijn net zo
     goed toevallige ruis */
  if(s.split(/\s+/).filter(function(w){ return /^[A-Z]{4,}$/.test(w); }).length<2) return false;
  var rommel=(s.match(/[^A-Z0-9 ]/g)||[]).length;
  if(rommel>s.length*0.15) return false;
  return true;
}
function adresUitRegels(regels){
  var ruw=adresUitRegelsRuw(regels);
  return ruw?adresOpschonen(ruw):"";
}
function adresUitRegelsRuw(regels){
  if(!regels || !regels.length) return "";
  var goed=regels.filter(function(r){ return r.score>=0.6 && r.tekst.replace(/[^A-Z0-9]/g,"").length>=6; });
  var gemerkt=goed.filter(function(r){ return /ADRE|ADDRESS/i.test(r.tekst); })[0];
  if(gemerkt) return gemerkt.tekst.replace(/^.*?ADRE\w*\s*[:.]?\s*/i,"").trim();
  var kand=goed.filter(function(r){ return adresAchtig(r.tekst); })
               .sort(function(a,b){ return b.tekst.length-a.tekst.length; })[0];
  return kand?kand.tekst.trim():"";
}
/* Uit de herkende tekst halen we de regel die er als een adres uitziet. */
/* Een tekstherkenner leest de Arabische opdruk en het woord "Adresse" ervoor als
   rommel mee ("Jarsss LOTSSEMENT..."), en laat in een lang woord wel eens een
   letter vallen. Beide zijn te herstellen zonder te gokken: we beginnen het adres
   bij het eerste echte adreswoord, en een woord dat op één letter na een bekend
   adreswoord is, zetten we recht. Verzinnen doen we niets — wat we niet herkennen
   laten we staan zoals het gelezen is. */
var ADRESLIJST=["LOTISSEMENT","RESIDENCE","IMMEUBLE","APPARTEMENT","QUARTIER","BOULEVARD",
  "AVENUE","SECTEUR","OPERATION","MEDINA","ZANKAT","CHARIA","DOUAR","ROUTE","ANGLE","PLACE",
  "CENTRE","VILLA","DERB","TARIK","BLOC","CITE","ETAGE","RUE","HAY"];
function afstand1(a,b){
  if(Math.abs(a.length-b.length)>1) return false;
  var i=0,j=0,fout=0;
  while(i<a.length && j<b.length){
    if(a[i]===b[j]){ i++; j++; continue; }
    if(++fout>1) return false;
    if(a.length>b.length) i++; else if(b.length>a.length) j++; else { i++; j++; }
  }
  if(i<a.length || j<b.length) fout++;
  return fout<=1;
}
function adresOpschonen(s){
  if(!s) return "";
  var t=String(s).toUpperCase().replace(/[^A-Z0-9°\/\-\s]/g," ").replace(/\s+/g," ").trim();
  var w=t.split(" ").map(function(x){
    if(x.length<4) return x;
    for(var i=0;i<ADRESLIJST.length;i++) if(x!==ADRESLIJST[i] && afstand1(x,ADRESLIJST[i])) return ADRESLIJST[i];
    return x;
  });
  /* alles vóór het eerste echte adreswoord weggooien: dat is de opdruk van de kaart */
  for(var k=0;k<w.length;k++) if(ADRESSTERK.test(w[k])){ w=w.slice(k); break; }
  return w.join(" ").replace(/\s+/g," ").trim();
}
function adresUitTekst(tekst){
  if(!tekst) return "";
  var regels=tekst.split("\n").map(function(r){ return r.replace(/\s+/g," ").trim(); }).filter(function(r){ return r.length>6; });
  var gemerkt=regels.filter(function(r){ return /ADRE|ADRESS|ADDRESS/i.test(r); })[0];
  if(gemerkt) return adresOpschonen(gemerkt.replace(/^.*?ADRE\w*\s*[:.]?\s*/i,"").trim());
  /* anders: de langste regel met letters én een huisnummer */
  var kandidaat=regels.filter(function(r){ return /[A-Za-z]{4,}/.test(r) && /\d/.test(r); })
                      .sort(function(a,b){ return b.length-a.length; })[0];
  return kandidaat?adresOpschonen(kandidaat):"";
}
/* En uit een rijbewijs: het nummer en de datums. */
function rijbewijsUitTekst(tekst){
  var o={};
  if(!tekst) return o;
  var t=tekst.replace(/[|]/g,"/");
  var nr=t.match(/\b\d{1,2}\s*\/\s*\d{4,8}\b/);
  if(nr) o.number=nr[0].replace(/\s/g,"");
  if(!o.number){ var alt=t.match(/\b[A-Z]{1,3}\d{5,10}\b/); if(alt) o.number=alt[0]; }
  var nu=new Date().getUTCFullYear(), gevonden=[];
  var re=/\b(\d{2})[\/.\-](\d{2})[\/.\-](\d{4})\b/g, m;
  while((m=re.exec(t))) gevonden.push({ iso:m[3]+"-"+m[2]+"-"+m[1], jaar:Number(m[3]) });
  var toekomst=gevonden.filter(function(d){ return d.jaar>=nu-1 && d.jaar<=nu+30; });
  if(toekomst.length) o.expiry=toekomst.sort(function(a,b){ return b.jaar-a.jaar; })[0].iso;
  return o;
}
/* Een rijbewijs heeft geen machineleesbare strook, maar wél vaak een streepjescode
   op de achterkant — het Marokkaanse permis en veel Europese kaarten. Die is exact
   te lezen: geen letterherkenning, geen giswerk. Chrome kan dit zelf, zonder dat er
   iets gedownload hoeft te worden. */
async function readBarcodes(blob){
  if(!("BarcodeDetector" in window)) return [];
  var soorten=["pdf417","qr_code","data_matrix","aztec","code_128","code_39","itf"];
  var kan=[];
  try{ kan=await window.BarcodeDetector.getSupportedFormats(); }catch(e){ kan=soorten; }
  var lijst=soorten.filter(function(f){ return kan.indexOf(f)>=0; });
  if(!lijst.length) return [];
  var det;
  try{ det=new window.BarcodeDetector({formats:lijst}); }catch(e){ return []; }
  var vol=await new Promise(function(res,rej){
    var u=URL.createObjectURL(blob), m=new Image();
    m.onload=function(){ URL.revokeObjectURL(u); res(m); };
    m.onerror=function(){ URL.revokeObjectURL(u); rej(new Error("img")); }; m.src=u;
  });
  /* Eerst verkleinen. Een telefoonfoto is twaalf miljoen beeldpunten; die vier keer
     draaien en doorzoeken laat de browser seconden stilstaan, en het lijkt dan alsof
     de app niets doet. Een streepjescode is op 1600 punten breed prima leesbaar. */
  var img=vol;
  if(vol.width>1600){
    var kc=document.createElement("canvas");
    kc.width=1600; kc.height=Math.round(vol.height*1600/vol.width);
    kc.getContext("2d").drawImage(vol,0,0,kc.width,kc.height);
    img=kc;
  }
  var uit=[], t0=Date.now();
  var standen=[0,90,180,270];
  for(var i=0;i<standen.length;i++){
    if(Date.now()-t0>5000) break;
    try{
      var src = standen[i]? turnImage(img,standen[i]) : img;
      var bm=await createImageBitmap(src);
      var hits=await det.detect(bm);
      for(var j=0;j<hits.length;j++) if(hits[j].rawValue) uit.push({ tekst:hits[j].rawValue, soort:hits[j].format });
      if(uit.length) break;
    }catch(e){}
  }
  return uit;
}
/* Uit de inhoud van zo'n code halen we wat we kunnen gebruiken: een rijbewijsnummer
   in de Marokkaanse vorm (bijvoorbeeld 07/118422) en een datum. Wat we niet zeker
   weten, laten we leeg — de ruwe inhoud tonen we er wel bij. */
function uitBarcode(tekst){
  var o={ raw:tekst };
  var nr=tekst.match(/\b\d{1,2}\s*\/\s*\d{5,8}\b/);
  if(nr) o.number=nr[0].replace(/\s/g,"");
  if(!o.number){ var alt=tekst.match(/\b[A-Z]{0,2}\d{6,12}\b/); if(alt) o.number=alt[0]; }
  var dl=tekst.match(/\b(\d{2})[\/.\-](\d{2})[\/.\-](\d{4})\b/g)||[];
  var jaren=dl.map(function(d){ var m=d.match(/(\d{2})[\/.\-](\d{2})[\/.\-](\d{4})/); return { iso:m[3]+"-"+m[2]+"-"+m[1], jaar:Number(m[3]) }; });
  var nu=new Date().getUTCFullYear();
  var toekomst=jaren.filter(function(d){ return d.jaar>=nu-2 && d.jaar<=nu+25; });
  if(toekomst.length) o.expiry=toekomst[toekomst.length-1].iso;
  return o;
}
/* QR lezen kan ook zonder bibliotheek: sommige browsers kunnen het zelf. */
async function readQR(canvas,ctx){
  if("BarcodeDetector" in window){
    try{
      var det=new window.BarcodeDetector({formats:["qr_code"]});
      var bm=await createImageBitmap(canvas), hits=await det.detect(bm);
      if(hits&&hits.length&&hits[0].rawValue) return hits[0].rawValue;
    }catch(e){}
  }
  if(await needLib("qrread")){
    try{
      var d=ctx.getImageData(0,0,canvas.width,canvas.height);
      var code=window.jsQR(d.data,canvas.width,canvas.height);
      if(code&&code.data) return code.data;
    }catch(e){}
  }
  return null;
}

function trustStats(){
  var done=RENTALS.filter(function(r){ return live(r) && r.retour; });

  var ds=rel.map(function(r){ return Math.max(0,dayDiff(r.retour.at,r.releasedAt)); });
  var avg=ds.length?Math.round(ds.reduce(function(a,b){return a+b;},0)/ds.length*10)/10:0;
  var within=ds.length?Math.round(ds.filter(function(d){ return d<=7; }).length/ds.length*100):0;

}

/* Marokkaanse agentschappen werken allemaal met hetzelfde papieren contract:
   links de huurder, rechts het voertuig en de facturatie, met de franchise en de
   boorddocumenten erbij. Atlas drukt precies die vorm af, zodat de verhuurder zijn
   eigen document herkent en niets hoeft uit te leggen aan de klant of de politie. */
function nomPrenom(naam){
  var d=String(naam||"").trim().split(/\s+/).filter(Boolean);
  if(d.length<2) return { nom:d[0]||"", prenom:"" };
  /* In de strook van een identiteitskaart staat de achternaam vooraan, en zo
     vullen alle scans het naamveld ook. */
  return { nom:d[0], prenom:d.slice(1).join(" ") };
}
function uurVan(iso){
  if(!iso) return "";
  var d=new Date(iso); if(isNaN(d.getTime())) return "";
  function tw(n){ return (n<10?"0":"")+n; }
  return tw(d.getHours())+":"+tw(d.getMinutes());
}
function geldigNu(d){ return !!(d && String(d).slice(0,10)>=today()); }
/* Op een contract hoort een datum voluit: 10/08/2030, niet 10-08-30. Een jaartal
   van twee cijfers leest bij een politiecontrole als een fout. */
function dNum(d){ if(!d) return ""; var x=String(d).slice(0,10).split("-"); return x.length===3?(x[2]+"/"+x[1]+"/"+x[0]):String(d); }
function cRij(k,v){
  var tekst=(v===null||v===undefined||v==="")?"—":String(v);
  return '<div class="rij"><span>'+esc(k)+'</span><b>'+esc(tekst)+'</b></div>';
}
/* Zelfde regel, maar met HTML als waarde — nodig voor de kentekenplaat, die in
   <bdi> moet staan omdat de Arabische letter anders de volgorde omdraait. */
function cRijH(k,h){ return '<div class="rij"><span>'+esc(k)+'</span><b>'+h+'</b></div>'; }

/* ============ BETALINGEN EN KAS ============
   Tot nu toe wist Atlas alleen wat er afgesproken was. Hier komt bij wat er echt
   betaald is, zodat de kassa 's avonds klopt. */
function pays(r){ return (r&&r.payments)||[]; }
function paidRent(r){ return pays(r).filter(function(x){ return x.kind!=="caution"; }).reduce(function(a,x){ return a+(Number(x.amount)||0); },0); }
function paidCaution(r){ return pays(r).filter(function(x){ return x.kind==="caution"; }).reduce(function(a,x){ return a+(Number(x.amount)||0); },0); }
function dueRent(r){ return Math.max(0,(Number(r.total)||0)-paidRent(r)); }
function dueCaution(r){ return Math.max(0,(Number(r.caution)||0)-paidCaution(r)); }

/* Alle geldbewegingen van één dag: binnen uit betalingen, buiten uit teruggegeven borg. */
/* Alle verhuren, ook geannuleerde: geld dat gisteren binnenkwam mag vandaag niet
   uit de geschiedenis verdwijnen omdat de boeking is afgezegd. Een negatief
   bedrag is geld dat je teruggaf. */
function cashMoves(day){
  var out=[];
  RENTALS.forEach(function(r){
    pays(r).forEach(function(x){
      var a=Number(x.amount)||0;
      /* alleen het etiket: een negatief bedrag bij een geannuleerde verhuur is
         geen borgteruggave maar een terugbetaling */
      var k = (a<0 && r.cancelled) ? "cancelback" : x.kind;
      if((x.date||"")===day) out.push({ r:r, dir:a<0?"out":"in", kind:k, amount:Math.abs(a), method:x.method||"cash", note:x.note||"", id:x.id });
    });
    if(r.released && r.releasedAt===day){
      var back=(r.cautionReturned!=null)?Number(r.cautionReturned):Number(r.caution)||0;
      if(back>0) out.push({ r:r, dir:"out", kind:"refund", amount:back, method:r.refundMethod||"cash", note:"" });
    }
  });
  return out;
}
var cashDate=null;
function renderCash(){
  var t=T(); if(!cashDate) cashDate=today();
  $("cashDay").textContent=dLong(cashDate);
  var mv=cashMoves(cashDate);
  var inn=mv.filter(function(m){ return m.dir==="in"; }).reduce(function(a,m){ return a+m.amount; },0);
  var uit=mv.filter(function(m){ return m.dir==="out"; }).reduce(function(a,m){ return a+m.amount; },0);
  function per(meth){ return mv.reduce(function(a,m){ return m.method===meth?a+(m.dir==="in"?m.amount:-m.amount):a; },0); }
  $("cashNet").textContent=dh(inn-uit); $("cashIn").textContent=dh(inn); $("cashOut").textContent=dh(uit);
  $("cashCash").textContent=dh(per("cash")); $("cashCard").textContent=dh(per("card"));
  var box=$("cashRows"); box.innerHTML="";
  if(!mv.length) box.appendChild(el("div","none",t.cashEmpty));
  mv.forEach(function(m){
    var c=car(m.r.vehicleId), row=el("div","lrow");
    var w=el("div","who"); w.appendChild(el("b",null,m.r.clientName));
    var cl=el("div","car"); cl.appendChild(el("span",null,c.model+" · "+m.r.code));
    cl.appendChild(el("span",null,"· "+t.payKinds[m.kind]+" · "+t.payMethods[m.method]));
    w.appendChild(cl); row.appendChild(w);
    var a=el("div","age"); var ab=el("b",null,(m.dir==="out"?"− ":"+ ")+dh(m.amount));
    if(m.dir==="out") ab.className="bad"; a.appendChild(ab); row.appendChild(a);
    row.style.cursor="pointer"; row.addEventListener("click",function(){ receipt(m.r, m.r.retour?"retour":"depart"); });
    box.appendChild(row);
  });

  var ob=$("cashOpen"); ob.innerHTML="";
  if(!open.length) ob.appendChild(el("div","none",t.cashNoOpen));

    var c=car(r.vehicleId), row=el("div","row");

    row.appendChild(k); row.appendChild(el("span","v neg",dh(dueRent(r))));

/* Het blok op de huurbon: wat is afgesproken, wat is betaald, wat staat nog open. */
function payPanel(r){

   nooit betaalde is geen geld in je la. */
function heldList(){ return RENTALS.filter(function(r){ return live(r) && paidCaution(r)>0 && !r.released && r.depart; }); }

  $("lOld").textContent=oldest?dayDiff(oldest.from,today())+" "+t.days:"—";
  var totalWithheld=RENTALS.filter(live).reduce(function(a,r){ return a+(Number(r.cautionWithheld)||0); },0);
  $("lWithheld").textContent=dh(totalWithheld);
  var box=$("lRows"); box.innerHTML="";
  if(!held.length) box.appendChild(el("div","none",t.ledEmpty));
  held.slice().sort(function(a,b){ return (a.from||"").localeCompare(b.from||""); }).forEach(function(r){
    var c=car(r.vehicleId), age=dayDiff(r.from,today()), lim=r.limit||limitDate(r), out=!r.retour, open=r.retour&&lim>=today(), over=r.retour&&lim<today();
    var row=el("div","lrow"); var w=el("div","who"); w.appendChild(el("b",null,r.clientName));
