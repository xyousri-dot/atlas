<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<style>
:root{
  --bg:#F1F4F1; --card:#FFFFFF;
  --ink:#151A16; --ink2:#596159; --ink3:#676F67;
  --line:#E4E8E3; --line2:#CED5CD; --rand:#868E86; --focus:#0C6A4C;
  --brand:#0C6A4C; --brand-2:#0A5540; --brand-soft:#E5F1EA;
  --warn:#C23F28; --warn-soft:#FBEAE4;
  --gold:#9A6E12; --gold-soft:#F9EFD9;
  --rc:16px; --rs:11px;
  --sh:0 1px 2px rgba(21,26,22,.05), 0 6px 18px -12px rgba(21,26,22,.28);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.022em;line-height:1.14;
  font-family:"Bricolage Grotesque",Figtree,-apple-system,sans-serif;font-weight:800}
/* Wie met een toetsenbord werkt moet zien waar hij staat. */
:where(button,a,input,select,textarea,[tabindex]):focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
[hidden]{display:none!important}
.mono{font-family:"JetBrains Mono",monospace}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
.bar-in{max-width:1100px;margin:0 auto;padding:12px 20px 8px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:9px;min-width:0}
.logo .m{width:30px;height:30px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.logo b{font-size:15.5px;font-weight:700;display:block;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
.logo i{font-style:normal;font-size:12px;color:var(--ink3);display:block;line-height:1.2}
.lang{margin-left:auto;display:flex;gap:1px;flex:none}
.lang button{font:inherit;font-size:12px;font-weight:700;padding:5px 9px;border:none;background:none;color:var(--ink3);cursor:pointer;border-radius:7px}
.lang button[aria-pressed="true"]{background:#E5E9E5;color:var(--ink)}
.tabs{max-width:1100px;margin:0 auto;padding:0 20px 10px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font:inherit;font-size:14px;font-weight:600;padding:8px 14px;border:none;border-radius:99px;background:#E5E9E5;color:var(--ink2);cursor:pointer;white-space:nowrap;flex:none}
.tabs button[aria-current="true"]{background:var(--ink);color:#fff}

.prog{max-width:1100px;margin:0 auto;padding:0 20px 10px}
.prog-row{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.prog-row b{font-size:13.5px;font-weight:700}
.prog-row span{font-size:13.5px;color:var(--ink3);margin-left:auto}
.track{height:5px;border-radius:99px;background:#DDE3DD;overflow:hidden}
.track i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .25s ease}
@media (prefers-reduced-motion:reduce){.track i{transition:none}}
/* De vier stappen als knopjes onder de balk: wat af is wordt groen, wat nog moet
   blijft grijs, en tikken brengt je meteen bij dat stuk van het formulier. */
.prog-stappen{display:flex;gap:6px;margin-top:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.prog-stappen::-webkit-scrollbar{display:none}
.prog-stappen button{flex:0 0 auto;font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap;
  border:1px solid var(--line2);background:var(--card);color:var(--ink2);border-radius:99px;padding:4px 10px;display:flex;align-items:center;gap:5px}
.prog-stappen button em{font-style:normal;font-weight:700;color:var(--ink)}
.prog-stappen button.af{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.prog-stappen button.nu{border-color:var(--ink);background:var(--ink);color:#fff}
.prog-stappen button.nu em{color:#fff}
/* Stappen: één kaart per scherm (zoals Turo) */
#vForm .stapuit{display:none!important}
#vForm .two.stappen{grid-template-columns:1fr}
.samenvat{list-style:none;padding:0;margin:0 0 14px}
.samenvat li{display:flex;justify-content:space-between;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line);font-size:15.5px}
.samenvat li b{font-weight:700}
.samenvat li button{font:inherit;font-size:14px;color:var(--brand);background:none;border:none;text-decoration:underline;cursor:pointer;padding:0}
.prog-stappen button.af em{color:var(--brand)}

.wrap{max-width:1100px;margin:0 auto;padding:4px 20px 130px}
.title{margin:14px 0 18px;display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.title h1{font-size:29px;font-weight:800}
.title p{margin:7px 0 0;color:var(--ink2);font-size:15.5px;max-width:56ch}
.title .add{margin-left:auto}

.card{background:var(--card);border-radius:var(--rc);box-shadow:var(--sh);padding:18px}
.card + .card{margin-top:12px}
.card h2.ch{font-size:18.5px;font-weight:700;margin-bottom:10px}
.chead{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.step{width:29px;height:29px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:14px;background:#EDF0EC;color:var(--ink3)}
.step.on{background:var(--brand);color:#fff}
.chead h2{font-size:18.5px;font-weight:700}
.chead p{margin:2px 0 0;font-size:14px;color:var(--ink3)}
.state{margin-left:auto;flex:none;font-size:13px;font-weight:600;color:var(--ink3);padding-top:4px}
.state.ok{color:var(--brand)}

.jobs{display:grid;gap:11px}
.jobwrap{background:var(--card);border-radius:var(--rc);box-shadow:var(--sh);overflow:hidden}
.jobwrap .job{box-shadow:none;border-radius:0;background:transparent}
.jobwrap .job:hover{box-shadow:none;background:rgba(21,26,22,.025)}
.jobacts{display:flex;gap:4px;flex-wrap:wrap;padding:0 14px 12px}
.jobacts button{background:none;border:none;font:inherit;color:var(--ink2);font-size:13.5px;font-weight:600;cursor:pointer;padding:6px 10px;border-radius:99px}
.jobacts button:hover{background:rgba(21,26,22,.06);color:var(--ink)}
.job .when .stp{display:block;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3);margin-top:5px}
.job{display:flex;align-items:center;gap:15px;width:100%;text-align:left;cursor:pointer;background:var(--card);border:none;border-radius:var(--rc);box-shadow:var(--sh);padding:16px 18px;font:inherit;color:inherit}
.job:hover{box-shadow:0 1px 2px rgba(21,26,22,.06),0 10px 24px -12px rgba(21,26,22,.4)}
.job .when{flex:none;width:96px}
.job .when b{display:block;font-size:15px;font-weight:700;letter-spacing:-.02em}
.pill{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:99px;margin-top:3px}
.pill.dep{background:var(--brand-soft);color:var(--brand)}
.pill.ret{background:var(--gold-soft);color:var(--gold)}
.pill.fin{background:#EDF0EC;color:var(--ink3)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.job .who{flex:1;min-width:0}
.job .who b{font-size:17px;font-weight:700;display:block;letter-spacing:-.015em}
.job .who .car{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink2);font-size:14px;margin-top:3px}
.job .amt{flex:none;text-align:right}
.job .amt b{display:block;font-size:16px;font-weight:700}
.job .amt span{font-size:12px;color:var(--ink3)}
.job .amt b.neg{color:var(--warn)}
.chev{flex:none;color:var(--line2);font-size:22px;line-height:1}

.plate{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);border-radius:5px;padding:1px 6px;font-family:"JetBrains Mono",monospace;font-size:12.5px;unicode-bidi:isolate;white-space:nowrap;background:var(--card)}
.plate i{font-style:normal;color:var(--ink3)}

.alerts{display:grid;gap:8px;margin-bottom:16px}
.alert{display:flex;align-items:center;gap:12px;background:var(--gold-soft);color:var(--gold);border-radius:var(--rs);padding:11px 14px;font-size:14px;font-weight:600;cursor:pointer;border:none;text-align:left;font-family:inherit;width:100%}
.alert.bad{background:var(--warn-soft);color:var(--warn)}
.alert span{flex:1}
.alert small{font-weight:500;opacity:.85}

.diag{display:grid;gap:16px}
.canvasbox{background:#F7F9F7;border-radius:var(--rs);padding:12px 6px 6px;display:grid;justify-items:center}
.canvasbox svg{display:block;width:172px;height:auto;max-width:100%;touch-action:manipulation}
#car:focus{outline:none}
#car:focus-visible{outline:2px solid var(--brand);outline-offset:-3px}
.car-body{fill:#FFFFFF;stroke:#B9C2B9;stroke-width:2.2}
.car-glass{fill:#EBEFEA;stroke:#B9C2B9;stroke-width:1.5}
.car-line{fill:none;stroke:#C8D0C8;stroke-width:1.5}
.car-wheel{fill:#E7EBE6;stroke:#B9C2B9;stroke-width:1.4}
.hit-layer{fill:transparent;cursor:crosshair;outline:none}
.mk circle{stroke-width:2.4}
.mk text{font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:500}
.mk.ref circle{fill:#EDF0EC;stroke:#7D867D}
.mk.ref text{fill:#4C544C}
.mk.new circle{fill:var(--warn-soft);stroke:var(--warn)}
.mk.new text{fill:var(--warn)}
.tap{font-size:13px;color:var(--ink3);text-align:center;padding:8px 6px 2px}

.mks{display:grid;gap:2px}
.mrow{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid var(--line)}
.mrow .n{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:"JetBrains Mono",monospace;font-size:12px;border:2px solid}
.mrow.new .n{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.mrow.ref .n{color:#4C544C;border-color:#7D867D;background:#EDF0EC}
.mrow .t{flex:1;min-width:0}
.mrow .t b{font-size:15px;font-weight:600;display:block}
.mrow .t span{font-size:13px;color:var(--ink3)}
.x{background:none;border:none;font:inherit;font-size:20px;line-height:1;color:var(--ink3);cursor:pointer;padding:0 4px}
.x:hover{color:var(--warn)}
.none{font-size:14.5px;color:var(--ink2);background:#F7F9F7;border-radius:var(--rs);padding:13px 14px}

.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.chips button{font:inherit;font-size:14px;font-weight:500;padding:9px 14px;border-radius:99px;cursor:pointer;background:var(--card);border:1px solid var(--line2);color:var(--ink2)}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.chips.flag button[data-v="warn"][aria-pressed="true"]{background:var(--gold);border-color:var(--gold)}
.chips.flag button[data-v="block"][aria-pressed="true"]{background:var(--warn);border-color:var(--warn)}

.confirm{width:100%;font:inherit;font-size:15px;font-weight:600;margin-top:12px;padding:13px;cursor:pointer;border-radius:var(--rs);border:1.5px dashed var(--line2);background:var(--card);color:var(--ink2)}
.confirm:hover{border-color:var(--brand);color:var(--brand)}
.confirm.done{border-style:solid;border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}

.shots{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.shot{position:relative;aspect-ratio:4/3;border-radius:var(--rs);overflow:hidden;cursor:pointer;background:#F7F9F7;border:1.5px dashed var(--line2);width:100%;padding:0;font:inherit;color:var(--ink3);display:grid;place-items:center;gap:6px;align-content:center}
.shot:hover{border-color:var(--brand);color:var(--brand)}
.shot.on{border:none}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:100%}
.shot .ic{position:relative;z-index:2;width:26px;height:22px;border:2px solid currentColor;border-radius:5px;display:block}
.shot .ic::before{content:"";position:absolute;inset:4px 6px;border:2px solid currentColor;border-radius:50%}
.shot .ic::after{content:"";position:absolute;top:-5px;left:6px;width:9px;height:4px;border:2px solid currentColor;border-bottom:none;border-radius:3px 3px 0 0}
.shot .cp{position:relative;z-index:2;font-size:13px;font-weight:600}
.shot.on .cp{position:absolute;left:0;right:0;bottom:0;color:#fff;text-align:left;padding:18px 10px 8px;background:linear-gradient(to top,rgba(0,0,0,.72),transparent)}
.shot .tick{position:absolute;top:7px;right:7px;z-index:3;width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}

.row{display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:none;padding-top:2px}
.row .k{font-size:15px;color:var(--ink2);flex:1;min-width:0}
.row .v{font-size:15.5px;font-weight:600;text-align:right}
.row .v.neg{color:var(--warn)}
.row .v.pos{color:var(--brand)}
input,select,textarea{font:inherit;font-size:16.5px;font-weight:600;color:var(--ink);background:var(--card);border:1.5px solid var(--line2);border-radius:var(--rs);padding:11px 13px;width:100%}
textarea{font-weight:500;min-height:70px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.kmwrap{display:flex;align-items:center;gap:10px}
.kmwrap input{max-width:180px;text-align:right}
.kmwrap span{color:var(--ink3);font-size:14px}
.gauge{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:10px}
.gauge button{font:inherit;font-size:15px;font-weight:600;padding:13px 2px;cursor:pointer;border-radius:var(--rs);background:var(--card);border:1.5px solid var(--line2);color:var(--ink2)}
.gauge button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}

.form{display:grid;gap:14px}
.form .f label{display:block;margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 60px 70px;gap:8px}
.calc{background:#F7F9F7;border-radius:var(--rs);padding:14px}
.calc .line{display:flex;justify-content:space-between;font-size:14.5px;color:var(--ink2);padding:3px 0}
.calc .tot{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);margin-top:8px;padding-top:9px;font-weight:700;font-size:19px}
.search{position:relative;margin-bottom:12px}
.search input{padding-left:40px}
.search::before{content:"";position:absolute;left:14px;top:50%;width:14px;height:14px;margin-top:-9px;border:2px solid var(--ink3);border-radius:50%}
.search::after{content:"";position:absolute;left:25px;top:50%;width:7px;height:2px;background:var(--ink3);transform:rotate(45deg);margin-top:2px}

.scanbox{border:1.5px dashed var(--line2);border-radius:var(--rc);padding:16px;text-align:center;background:#F7F9F7}
.scanbox b{display:block;font-size:15.5px}
.scanbox p{margin:5px 0 12px;font-size:13.5px;color:var(--ink2)}
.scanbox .btn{width:100%}
.scanbox.busy{border-style:solid;border-color:var(--brand)}
.docs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.docs img{width:96px;height:64px;object-fit:cover;border-radius:7px;border:1px solid var(--line)}

.sig{position:relative;border:1.5px solid var(--line2);border-radius:var(--rs);background:var(--card);height:140px;touch-action:none;overflow:hidden}
.sig canvas{display:block;width:100%;height:100%}
.sig .gh{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:var(--ink3);font-size:14px}
.sig .gh.off{display:none}
.sigfoot{display:flex;justify-content:space-between;align-items:center;margin-top:9px}
.link{background:none;border:none;padding:0;font:inherit;font-size:14px;font-weight:600;color:var(--brand);cursor:pointer;text-decoration:underline}

.promise{background:var(--brand);color:#fff;border-radius:var(--rc);padding:20px;box-shadow:var(--sh)}
.promise .cap{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.promise .amt{display:block;font-size:40px;font-weight:800;letter-spacing:-.03em;margin:4px 0 2px;line-height:1.05}
.promise p{margin:12px 0 0;font-size:15px;line-height:1.55;opacity:.95}
.promise ul{margin:10px 0 0;padding-left:20px;font-size:14.5px;line-height:1.55;opacity:.95}
.promise li{margin-bottom:5px}
.promise .when{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.28)}
.promise .when b{display:block;font-size:19px;font-weight:700}
.promise .when span{font-size:14px;opacity:.85}

.verdict{background:#F7F9F7;border-radius:var(--rc);padding:18px}
.verdict .cap{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.verdict .amt{display:block;font-size:32px;font-weight:800;letter-spacing:-.03em;margin:3px 0 10px}
.verdict ul{margin:0;padding-left:20px;font-size:15px;line-height:1.6}
.verdict li{margin-bottom:5px}
.verdict .out{margin-top:14px;padding-top:13px;border-top:1px solid var(--line);font-size:15.5px;font-weight:600}
.verdict .out span{display:block;font-weight:400;font-size:13.5px;color:var(--ink3);margin-top:3px}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(241,244,241,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px))}
.dock-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dock .note{flex:1 1 100%;order:-1;font-size:13.5px;color:var(--ink2);line-height:1.35}
@media(min-width:640px){.dock .note{flex:1 1 auto;order:0}}
@media(max-width:639px){.dock .btn{flex:1 1 auto}.dock .btn.ghost{flex:0 0 auto}}
/* ============ TELEFOON ============
   De verhuurder staat met zijn toestel bij de auto. Dan moet alles met één duim
   kunnen: ruime knoppen, invoervelden die niet inzoomen (onder de 16px zoomt iOS
   het scherm in en dan staat de pagina scheef), en geen enkele regel die breder is
   dan het scherm. */
@media(max-width:700px){
  .bar-in,.tabs,.prog,.wrap,.dock-in{padding-left:14px;padding-right:14px}
  .wrap{padding-bottom:150px}
  input,select,textarea{font-size:16px}          /* voorkomt inzoomen op iPhone */
  .btn{min-height:46px}
  .dz{padding:22px 12px}
  .dz-k{flex-direction:column}
  .dz-k .btn{width:100%;min-width:0}
  .row{flex-wrap:wrap}
  .kmwrap input{max-width:120px}
  .cam .cam-knoppen .btn{min-width:0;flex:1}
}
@media(max-width:400px){
  .logo b{max-width:44vw}
  .tabs button{padding-left:10px;padding-right:10px}
}
/* niets mag horizontaal uit het scherm lopen */
html,body{max-width:100%;overflow-x:hidden}
img,canvas,video,svg,table{max-width:100%}
.btn{font:inherit;font-size:16px;font-weight:700;padding:14px 24px;border-radius:99px;cursor:pointer;background:var(--brand);color:#fff;border:none;flex:none}
.btn:hover{background:var(--brand-2)}
.btn[disabled]{background:#C6CDC6;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--ink2);box-shadow:var(--sh)}
.btn.ghost:hover{background:#F7F9F7}
.btn.sm{font-size:14.5px;padding:10px 17px}
.btn.dangerish{background:var(--card);color:var(--warn);box-shadow:var(--sh)}

.hero{background:var(--card);border-radius:var(--rc);box-shadow:var(--sh);padding:22px}
.hero .amt{display:block;font-size:42px;font-weight:800;letter-spacing:-.035em;line-height:1.02;margin:5px 0 0}
.hero .amt.neg{color:var(--warn)}
.hero .grid{display:flex;gap:26px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.hero .grid b{display:block;font-size:20px;font-weight:700;margin-top:2px}
.hero .grid b.bad{color:var(--warn)}

.led{display:grid;gap:10px;margin-top:12px}
.lrow{display:flex;align-items:center;gap:15px;background:var(--card);border-radius:var(--rc);box-shadow:var(--sh);padding:15px 18px;flex-wrap:wrap}
.lrow .who{flex:1 1 180px;min-width:0}
.lrow .who b{display:block;font-size:16px;font-weight:700}
.lrow .who .car{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink2);font-size:13.5px;margin-top:3px}
.lrow .age{flex:none;text-align:right}
.lrow .age b{display:block;font-size:17px;font-weight:700}
.lrow .age b.bad{color:var(--warn)}
.lrow .age span{font-size:12px;color:var(--ink3)}
.lrow .st{flex:none;text-align:right;min-width:142px}
.lrow .st .why{display:block;font-size:12.5px;color:var(--ink3);margin-top:5px;line-height:1.35}

.find{background:var(--card);border-radius:var(--rc);box-shadow:var(--sh);padding:20px;margin-top:22px}
.find h2{font-size:21px;font-weight:700;margin-top:4px}
.find .fields{display:grid;gap:12px;margin-top:16px}
.answer{border-radius:var(--rc);padding:18px;margin-top:16px}
.answer.hit{background:var(--warn-soft)}
.answer.miss{background:#F7F9F7}
.answer h3{font-size:21px;font-weight:800}
.answer .meta{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--ink2);margin-top:3px}
.answer p{margin:12px 0 0;font-size:15.5px;line-height:1.55}
.call{display:inline-flex;align-items:center;gap:8px;margin-top:14px;text-decoration:none;color:#fff;background:var(--ink);border-radius:99px;padding:11px 18px;font-weight:600;font-size:15px}
.wa{display:inline-flex;align-items:center;gap:9px;margin-top:12px;text-decoration:none;background:var(--brand);color:#fff;border-radius:99px;padding:14px 22px;font-weight:700;font-size:16px}

.cmp{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
.cmp figure{margin:0}
.cmp figcaption{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin-bottom:5px}
.cmp img{width:100%;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--rs)}
.cmp .nope{aspect-ratio:4/3;border-radius:var(--rs);background:#F7F9F7;display:grid;place-items:center;font-size:13px;color:var(--ink3);text-align:center;padding:10px}

.empty{background:var(--card);border-radius:var(--rc);box-shadow:var(--sh);padding:30px 22px;text-align:center}
.empty h2{font-size:21px;font-weight:700}
.empty p{margin:8px auto 18px;color:var(--ink2);font-size:15px;max-width:44ch}
.empty .btn{margin:0 5px}

/* planning grid */
.plan-nav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.plan-nav h2{font-size:20px;font-weight:700;flex:1}
.plan-nav button{font:inherit;font-weight:700;width:38px;height:38px;border-radius:50%;border:none;background:var(--card);box-shadow:var(--sh);cursor:pointer;color:var(--ink2)}
.planwrap{overflow-x:auto;background:var(--card);border-radius:var(--rc);box-shadow:var(--sh);padding:10px 0 12px}
.plan{display:grid;min-width:max-content;font-size:12px}
.plan .hc{position:sticky;left:0;background:var(--card);z-index:2;padding:6px 14px 6px 16px;font-weight:700;font-size:13.5px;border-right:1px solid var(--line);min-width:150px;display:flex;align-items:center;gap:6px}
.plan .hd{width:34px;text-align:center;color:var(--ink3);padding:4px 0;border-bottom:1px solid var(--line);font-weight:600}
.plan .hd.today{color:var(--brand)}
.plan .hd.we{background:#F7F9F7}
.plan .cell{width:34px;height:44px;border-bottom:1px solid var(--line);position:relative}
.plan .cell.we{background:#F7F9F7}
.plan .cell.today{box-shadow:inset 2px 0 0 var(--brand)}
.plan .bar{position:absolute;top:9px;height:26px;border-radius:7px;color:#fff;font-size:11.5px;font-weight:600;padding:0 8px;line-height:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;z-index:1;border:none;font-family:inherit;text-align:left}
.plan .bar.res{background:#6C8F80}
.plan .bar.out{background:var(--brand)}
.plan .bar.late{background:var(--warn)}
.plan .bar.fin{background:#B7C0B7}

.ask{position:fixed;inset:0;z-index:90;background:rgba(18,20,22,.45);display:flex;align-items:center;justify-content:center;padding:22px}
.ask>div{background:#fff;border-radius:16px;box-shadow:var(--sh);max-width:420px;width:100%;padding:22px}
.ask p{margin:0 0 18px;font-size:15.5px;line-height:1.55;color:var(--ink)}
.ask .btns{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
.slot{border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px;text-align:left;background:rgba(255,255,255,.55)}
.cam{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .kader{position:relative;width:min(92vw,720px);aspect-ratio:1.586;border:3px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 0 0 200vmax rgba(0,0,0,.55)}
.cam .kader.raak{border-color:#4ade80}
.cam .cam-txt{position:absolute;left:0;right:0;bottom:118px;text-align:center;color:#fff;font-weight:700;font-size:16px;padding:0 20px;text-shadow:0 1px 3px #000}
.cam .cam-knoppen{position:absolute;left:0;right:0;bottom:28px;display:flex;gap:10px;justify-content:center;padding:0 16px}
.cam .cam-knoppen .btn{min-width:140px}
.slot-h{font-weight:800;font-size:15px;letter-spacing:-.01em}
/* Eén stap per blok: nummer, titel, vinkje als hij klaar is. */
/* Let op: ".stap" bestond al voor de koppen in het scanvak. Deze blokken heten
   daarom ".vstap" — anders vechten twee regels om hetzelfde element. */
.vstap{background:var(--card);border:1px solid var(--line);border-radius:var(--rc);box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}
.vstap-k{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--line)}
.vstap-k b{font-size:16px;font-weight:800;letter-spacing:-.015em;font-family:"Bricolage Grotesque",Figtree,sans-serif}
.vstap-nr{width:25px;height:25px;border-radius:50%;background:var(--brand-soft);color:var(--brand);
  display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}
.vstap-ok{margin-left:auto;color:var(--brand);font-weight:800;font-size:15px;text-align:right}
.vstap-in{padding:14px}
.btn.groot{min-height:56px;font-size:17px}
/* auto's als tegels: kijken en kiezen, geen uitklaplijst */
.tegels{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tegel{text-align:left;font:inherit;color:inherit;cursor:pointer;background:var(--card);
  border:1px solid var(--line2);border-radius:var(--rs);padding:11px 12px;min-height:58px}
.tegel b{display:block;font-size:15px;font-weight:700}
.tegel span{display:block;font-size:12.5px;color:var(--ink2)}
/* In een tegel hoeft de plaat geen kadertje: hij mag gewoon op één regel met de
   dagprijs staan. De isolate blijft wel, anders draait de Arabische letter de
   volgorde om. */
.tegel{padding:10px 12px}
.tegel .plate{border:0;padding:0;background:none;font-family:inherit;font-size:inherit;color:inherit;gap:4px}
.tegel[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand)}
.tegel:disabled{opacity:.5;cursor:not-allowed}
/* Status van de kaartlezing op het huurscherm zelf. */
/* Op de telefoon: de knoppen van de bon (contract, WhatsApp) boven de details. */
@media(max-width:859px){ #vDone .two{display:flex;flex-direction:column} #vDone #rSide{order:-1;margin-bottom:14px} }
/* Autoscherm op de telefoon: eerst wat de auto opbrengt, dan de formulieren. */
@media(max-width:859px){ #vCar .two{display:flex;flex-direction:column} #vCar #cwSide{order:-1;margin-bottom:14px} }
/* ---- compacte formulieren ---- */
details.kort{margin-top:10px}
details.kort>summary{cursor:pointer;list-style:none;font-size:14.5px;color:var(--ink2);padding:10px 12px;border-radius:10px;background:var(--bg2,rgba(0,0,0,.035));min-height:44px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
details.kort>summary::-webkit-details-marker{display:none}
details.kort>summary .pas,details.kort>summary.pas{color:var(--brand);font-weight:700;text-decoration:underline;text-underline-offset:2px}
details.kort[open]>summary{background:transparent;padding-left:2px}
.prijsregel{margin-top:12px;padding:14px;border-radius:12px;background:var(--brand-soft);color:var(--ink);font-size:16px;line-height:1.45}
.prijsregel b{font-size:20px;color:var(--brand)}
.prijsregel small{display:block;color:var(--ink2);font-size:13.5px;margin-top:2px}
#vNew #nwP{display:none}
#vFleet #tagsBtn{display:none}
.status{display:inline-block;font-size:13px;font-weight:800;padding:4px 10px;border-radius:99px;white-space:nowrap}
.status.vrij{background:var(--brand-soft);color:var(--brand)}
.status.weg{background:rgba(0,0,0,.06);color:var(--ink2)}
.status.laat{background:rgba(180,40,40,.1);color:var(--warn)}
/* ---- klaar-scherm ---- */
#rSide .wa{display:flex;justify-content:center;align-items:center;width:100%;box-sizing:border-box;margin-top:8px}
.klaarkop{display:flex;align-items:center;gap:12px;padding:16px;border-radius:14px;background:var(--brand-soft);margin-bottom:12px}
.klaarkop .vink{flex:0 0 44px;height:44px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:900}
.klaarkop b{display:block;font-size:17px}
.klaarkop span{font-size:14px;color:var(--ink2)}
.betaald{display:grid;gap:8px;margin-top:12px}
.betaald .btn{width:100%;min-height:50px;justify-content:space-between;display:flex;align-items:center}
.borgregel{margin-top:12px;padding:12px 14px;border:1px solid var(--line2);border-radius:12px;font-size:14.5px;color:var(--ink2)}
.borgregel b{color:var(--ink)}
/* ---- simpel startscherm ---- */
#vDay .title{flex-direction:column;align-items:stretch;gap:12px}
#vDay .title .add{width:100%}
#vDay #scanKey{display:none}
#vDay #newRental{width:100%;min-height:64px;font-size:20px;font-weight:800;border-radius:16px}
.tabs button[data-v="vPlan"],.tabs button[data-v="vLed"],.tabs button[data-v="vCash"],.tabs button[data-v="vSet"]{display:none}
.tabs.alles button[data-v="vPlan"],.tabs.alles button[data-v="vLed"],.tabs.alles button[data-v="vCash"],.tabs.alles button[data-v="vSet"]{display:inline-flex}
.tabs button[data-v="vPlan"][aria-current="true"],.tabs button[data-v="vLed"][aria-current="true"],.tabs button[data-v="vCash"][aria-current="true"],.tabs button[data-v="vSet"][aria-current="true"]{display:inline-flex}
.sh{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:22px 2px 8px}
.kaartje{background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:14px;margin-bottom:10px}
.kaartje.laat{border-color:var(--warn);box-shadow:inset 4px 0 0 var(--warn)}
.kaartje .boven{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.kaartje .auto{font-size:17px;font-weight:800}
.kaartje .wie{font-size:15px;color:var(--ink2);margin-top:2px}
.kaartje .wanneer{font-size:14px;font-weight:700;color:var(--ink2);white-space:nowrap}
.kaartje .wanneer.vandaag{color:var(--gold)}
.kaartje .wanneer.laat{color:var(--warn)}
.kaartje .knoppen{display:flex;gap:8px;margin-top:12px}
.kaartje .knoppen .btn{flex:1;min-height:48px;font-size:16px}
.kaartje .knoppen .btn.ghost{flex:0 0 auto}
.vrijlijst{display:flex;flex-wrap:wrap;gap:8px}
.vrijlijst button{font:inherit;font-size:14.5px;font-weight:700;min-height:44px;padding:8px 14px;border-radius:99px;border:1px solid var(--brand);background:var(--brand-soft);color:var(--brand);cursor:pointer}
.leegtje{color:var(--ink3);font-size:15px;padding:6px 2px}
.aanmeldbalk{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;justify-content:space-between;
  padding:12px 14px;margin-bottom:14px;border-radius:12px;border:1px solid var(--brand);background:var(--brand-soft);color:var(--ink);font-size:14.5px;line-height:1.4}
.aanmeldbalk span{flex:1 1 220px}
.snelstat{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:14px;line-height:1.4;background:var(--card);border:1px solid var(--line2)}
.snelstat.bezig{border-color:var(--rand);color:var(--ink2)}
.snelstat.ok{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}
.snelstat.half{border-color:var(--gold);color:var(--ink)}
/* Wat er staat als er nog geen auto's zijn: geen lege plek, maar de weg vooruit. */
.leegvak{grid-column:1/-1;border:1px dashed var(--rand);border-radius:10px;padding:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.leegvak p{margin:0 0 0 2px;flex:1 1 200px;font-size:13.5px;color:var(--ink2)}
/* dagen: de vier die ze in de praktijk gebruiken */
.dagen{display:flex;gap:8px;flex-wrap:wrap}
.dagknop{flex:1 1 auto;min-width:70px;min-height:46px;border-radius:var(--rs);border:1px solid var(--line2);
  background:var(--card);color:inherit;font:inherit;font-weight:700;cursor:pointer}
.dagknop[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
/* Neerzetvak: één groot, duidelijk doel per document. Dat is wat de scanners van
   de grote aanbieders ook doen — niet vier knopjes naast elkaar, maar één vlak
   waar de foto heen moet. */
.dz{border:2px dashed var(--line);border-radius:14px;padding:18px 14px;text-align:center;
    background:rgba(255,255,255,.45);transition:border-color .15s,background .15s}
.dz.over{border-color:var(--acc);background:rgba(16,122,87,.07)}
.dz-t{font-weight:700;font-size:14px;color:var(--ink2);margin:0 0 10px;display:none}
/* Slepen kan alleen met een muis. Op een telefoon is die regel verwarrend, dus
   daar tonen we hem niet: daar zijn de twee knoppen het hele verhaal. */
@media (hover:hover) and (pointer:fine){ .dz-t{display:block} }
.dz-k{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.dz-k .btn{min-width:140px}
.stap{display:flex;align-items:center;gap:8px;margin:0 0 2px}
.stap b{font-weight:800;font-size:15px;letter-spacing:-.01em}
.stapnr{flex:0 0 22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;
        font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
details.meer{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.4)}
details.meer>summary{cursor:pointer;padding:10px 12px;font-weight:700;font-size:14px;color:var(--ink2);list-style:none}
details.meer>summary::-webkit-details-marker{display:none}
details.meer>summary:before{content:"\25B8 ";color:var(--acc)}
details.meer[open]>summary:before{content:"\25BE "}
details.meer>div{padding:0 12px 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:#fff;padding:12px 20px;border-radius:99px;font-size:14.5px;font-weight:600;box-shadow:var(--sh);max-width:90vw}
.banner{background:var(--gold-soft);color:var(--gold);border-radius:var(--rs);padding:11px 14px;font-size:13.5px;font-weight:600;margin-bottom:14px}
.fine{margin-top:22px;font-size:13px;color:var(--ink3);line-height:1.55}
.fine b{color:var(--ink2)}
.sub-h{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin:22px 0 10px}

.tl{display:grid;gap:0;margin-top:6px}
.tl div{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.tl div:first-child{border-top:none}
.tl i{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;background:#EDF0EC;color:var(--ink3)}
.tl div.on i{background:var(--brand);color:#fff}
.tl div.on{font-weight:600}
.tl small{margin-left:auto;color:var(--ink3);font-size:13px;font-weight:400}
.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.gal img{width:100%;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{background:#F7F9F7;border-radius:var(--rs);padding:14px}
.stat b{display:block;font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.stat span{font-size:13px;color:var(--ink2)}
.badge{border:1.5px solid var(--brand);border-radius:var(--rc);padding:16px 18px;margin-top:12px;background:var(--brand-soft)}
.badge b{display:block;font-size:17px;color:var(--brand)}
.badge p{margin:6px 0 0;font-size:14px;color:var(--ink2);line-height:1.5}
.copybox{background:var(--card);border:1px solid var(--line2);border-radius:var(--rs);padding:12px 14px;font-size:14px;line-height:1.5;margin-top:10px;white-space:pre-wrap}
@media(min-width:860px){.stats{grid-template-columns:repeat(4,1fr)}}
.tags{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tag{border:1.5px solid #111;border-radius:10px;padding:12px;display:flex;gap:12px;align-items:center}
.tag img{width:84px;height:84px}
.tag b{display:block;font-size:15px}
.tag span{display:block;font-size:12px;color:#555;font-family:"JetBrains Mono",monospace}
.tag small{display:block;font-size:10px;color:#888;margin-top:4px}
.advice{border-radius:var(--rc);padding:18px;margin-top:12px}
.advice.keep{background:var(--brand-soft)}
.advice.watch{background:var(--gold-soft)}
.advice.early{background:#F7F9F7}
.advice b{display:block;font-size:17px;margin-bottom:6px}
.advice.keep b{color:var(--brand)} .advice.watch b{color:var(--gold)}
.advice p{margin:0;font-size:14.5px;line-height:1.55;color:var(--ink2)}
.advice .kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin-top:10px;font-size:14px}
.advice .kv span:nth-child(even){font-weight:700;text-align:right}
.check-me{animation:checkpulse 1.6s ease-in-out 3;border-color:var(--gold)!important;background:var(--gold-soft)!important}
@keyframes checkpulse{0%,100%{box-shadow:0 0 0 0 rgba(154,110,18,0)}50%{box-shadow:0 0 0 4px rgba(154,110,18,.25)}}
@media (prefers-reduced-motion:reduce){.check-me{animation:none}}
.shot-thumb{position:relative;display:inline-block;line-height:0}
.shot-thumb img{width:96px;height:64px;object-fit:cover;border-radius:7px;border:1px solid var(--line);display:block}
.thumb-lab{position:absolute;left:0;right:0;bottom:0;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.55);padding:2px 4px;border-radius:0 0 7px 7px;text-align:center;line-height:1.3}
.thumb-x{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:none;background:var(--warn);color:#fff;font-size:15px;line-height:1;cursor:pointer;box-shadow:var(--sh);padding:0}
.cropbox{position:relative;display:inline-block;max-width:100%;line-height:0;touch-action:none;cursor:crosshair}
.cropbox canvas{max-width:100%;border-radius:9px;display:block}
.cropbox #cropSel{position:absolute;border:2px solid var(--brand);background:rgba(12,106,76,.14);pointer-events:none;display:none}
.mrzdemo{background:#EEF2EE;border-radius:9px;padding:9px 11px;overflow-x:auto}
.mrzdemo span{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:5px}
.mrzdemo code{font-family:"JetBrains Mono",monospace;font-size:10.5px;line-height:1.7;color:var(--ink2);white-space:pre}
.hidden-qr{position:fixed;left:-3000px;top:0}
#sheet{position:fixed;left:-4000px;top:0;width:794px;background:#fff;color:#111;padding:54px 56px;font-family:Figtree,Arial,sans-serif;font-size:13px;line-height:1.5}
#sheet h1{font-size:23px;font-weight:800;margin:0}
#sheet .hd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #111;padding-bottom:12px;margin-bottom:18px}
#sheet .hd .ag{font-size:17px;font-weight:800}
#sheet .hd .ct{font-size:12px;color:#666}
#sheet h2{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#666;margin:20px 0 7px}
#sheet table{width:100%;border-collapse:collapse;font-size:13px}
#sheet td{padding:5px 0;vertical-align:top;border-bottom:1px solid #eee}
#sheet td:first-child{color:#666;width:44%}
#sheet td:last-child{text-align:right;font-weight:600}
#sheet .box{border:1.5px solid #111;padding:14px;margin-top:14px}
#sheet .box b{font-size:18px}
#sheet .sg{display:flex;gap:30px;margin-top:26px}
#sheet .sg div{flex:1;border-top:1px solid #111;padding-top:7px;font-size:11.5px;color:#666}
#sheet .sg img{max-height:64px;display:block;margin-bottom:4px}
#sheet .sm{font-size:10.5px;color:#777;margin-top:22px;line-height:1.45}
/* ---- huurcontract in de vorm die Marokkaanse agentschappen al gebruiken:
   twee kolommen, elk vak met een zwarte kop, en per regel label + waarde op de
   stippellijn. Zo herkent de verhuurder zijn eigen papier terug. ---- */
#sheet .kol{display:flex;gap:14px;align-items:flex-start}
#sheet .kol>div{flex:1;min-width:0}
#sheet .vak{border:1px solid #111;margin-bottom:9px}
#sheet .vak>h3{margin:0;background:#111;color:#fff;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;text-align:center}
#sheet .vak .in{padding:7px 9px}
#sheet .rij{display:flex;gap:8px;align-items:baseline;padding:2.5px 0;font-size:11.5px;border-bottom:1px dotted #c4c4c4}
#sheet .rij:last-child{border-bottom:0}
#sheet .rij>span{color:#555;flex:0 0 48%}
#sheet .rij>b{font-weight:700;flex:1;text-align:right;word-break:break-word}
#sheet .vak .kop{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#666;margin:8px 0 3px;border-top:1px solid #ddd;padding-top:6px}
#sheet .vrij{font-size:11.5px;min-height:26px;border-bottom:1px dotted #c4c4c4;padding:3px 0}
#sheet .sg2{display:flex;gap:14px;margin-top:12px}
#sheet .sg2>div{flex:1;border:1px solid #111;padding:7px 9px;min-height:74px;font-size:10.5px;color:#555}
#sheet .sg2 img{max-height:46px;display:block;margin:3px 0}
#sheet .let{border:1.5px solid #111;padding:7px 9px;margin-top:10px;font-size:11px;text-align:center;font-weight:700}
#sheet .plate{background:#fff;border-color:#111;color:#111;font-size:11.5px}
#sheet .plate i{color:#666}

@media (min-width:860px){
  .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:20px;align-items:start}
  .diag{grid-template-columns:auto minmax(0,1fr);align-items:start}

}

/* ===== Menu onderaan, voor de duim (zoals de host-apps van Airbnb en Turo) ===== */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:60;max-width:none;margin:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));
  display:grid;grid-template-columns:repeat(5,1fr);gap:0;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);overflow:visible}
.tabs button{display:flex!important;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none!important;color:var(--ink3)!important;
  border-radius:12px;padding:6px 2px!important;font-size:11.5px;font-weight:600;min-height:54px}
.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="true"]{color:var(--brand)!important}
.tabs button[data-v="vLed"],.tabs button[data-v="vCash"],.tabs button[data-v="vSet"]{display:none!important}
.tabs[hidden]{display:none!important}
.wrap{padding-bottom:110px}
/* knoppenbalk: grote hoofdknop, kleine terugknop op één regel */
.dock #bGo{flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock #bBack{flex:0 0 auto}
#bGo small.knopprijs{display:block;font-size:13px;font-weight:600;opacity:.85;line-height:1.1;margin-top:1px}
@media (max-width:640px){ .dock-in{flex-wrap:nowrap} .dock .note{display:none} .dock #bBack{padding-left:16px;padding-right:16px} }
.meerblad{position:fixed;inset:0;z-index:70;background:rgba(20,30,20,.35);display:flex;align-items:flex-end}
.meerblad .in{background:var(--card);width:100%;border-radius:20px 20px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.15)}
.meerblad .greep{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.meerblad button.rij{display:flex;align-items:center;gap:14px;width:100%;font:inherit;font-size:17px;font-weight:600;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);padding:16px 6px;color:var(--ink);cursor:pointer}
.meerblad button.rij svg{width:24px;height:24px;stroke:var(--brand);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.meerblad .talen{display:flex;gap:8px;margin-top:14px}
.meerblad .talen button{flex:1;font:inherit;font-weight:700;padding:12px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer}
.meerblad .talen button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.bar .lang{display:none}
/* Planning op de telefoon: smallere naamkolom, grotere vakken */
@media (max-width:640px){ .plan .hc{min-width:96px;padding:6px 8px 6px 12px;font-size:12.5px} .plan .hd,.plan .cell{width:40px} .plan .cell{height:52px} }

/* ===== Arabisch: van rechts naar links ===== */
html[lang="ar"] body, html[lang="ar"] button, html[lang="ar"] input, html[lang="ar"] select, html[lang="ar"] textarea{font-family:"Noto Sans Arabic",Figtree,system-ui,sans-serif}
html[lang="ar"] h1, html[lang="ar"] h2, html[lang="ar"] h3{font-family:"Noto Sans Arabic","Bricolage Grotesque",sans-serif;letter-spacing:0}
html[lang="ar"] .lbl, html[lang="ar"] .groep-k b{letter-spacing:0;text-transform:none}
/* Franse documenten (contract, verklaring) houden hun eigen letter. */
html[lang="ar"] #sheet, html[lang="ar"] #sheet h1, html[lang="ar"] #sheet h2, html[lang="ar"] #sheet h3{font-family:Figtree,Arial,sans-serif}
[dir="rtl"] .prog-row span, [dir="rtl"] .title .add, [dir="rtl"] .state, [dir="rtl"] .vstap-ok, [dir="rtl"] .tl small{margin-left:0;margin-right:auto}
[dir="rtl"] .job, [dir="rtl"] .slot, [dir="rtl"] .tegel, [dir="rtl"] .meerblad button.rij{text-align:right}
[dir="rtl"] .job .amt, [dir="rtl"] .row .v, [dir="rtl"] .lrow .age, [dir="rtl"] .lrow .st, [dir="rtl"] .advice .kv span:nth-child(even), [dir="rtl"] .vstap-ok{text-align:left}
[dir="rtl"] .search input{padding-left:14px;padding-right:40px}
[dir="rtl"] .search::before{left:auto;right:14px}
[dir="rtl"] .search::after{left:auto;right:25px;transform:rotate(-45deg)}
[dir="rtl"] .promise ul, [dir="rtl"] .verdict ul{padding-left:0;padding-right:20px}
[dir="rtl"] .shot .tick{right:auto;left:7px}
[dir="rtl"] .thumb-x{right:auto;left:-7px}
[dir="rtl"] .shot.on .cp{text-align:right}
[dir="rtl"] details.kort[open]>summary{padding-left:0;padding-right:2px}
/* De planning is een kalender: die blijft van links naar rechts lopen. */
.job .winst{font-size:13.5px;font-weight:700;margin-top:4px}
.job .winst.plus{color:var(--brand)}
.job .winst.min{color:var(--warn)}
/* ===== Nieuw uiterlijk (ronde 4) =====
   Groene kop met de cijfers van vandaag (zoals een bankapp), een grote + in het
   midden van het menu (zoals Square), grote kaarten en tegels, en een nieuw
   contract in drie duidelijke stappen. */
:root{ --rc:20px; --rs:14px; --sh:0 1px 2px rgba(21,26,22,.04), 0 10px 28px -14px rgba(21,26,22,.22); }
#vDay > .title{display:none}
.held{background:linear-gradient(160deg,#0E7553 0%,#0A5540 70%,#08432F 100%);color:#fff;border-radius:24px;padding:20px 18px 16px;margin:6px 0 4px;box-shadow:0 18px 40px -22px rgba(8,67,47,.75);position:relative;overflow:hidden}
.held::after{content:"";position:absolute;inset-inline-end:-60px;top:-70px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.07)}
.held-dag{margin:0;font-size:14px;font-weight:600;opacity:.8}
.held-dag::first-letter{text-transform:uppercase}
.held-titel{margin:4px 0 16px;font-size:27px;font-weight:800;letter-spacing:-.02em;color:#fff}
.held-knop{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;border:none;border-radius:16px;background:#fff;color:#0A5540;font:inherit;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 6px 16px -8px rgba(0,0,0,.4)}
.held-knop::before{content:"+";font-size:26px;font-weight:600;line-height:1}
.held .strook{margin:14px 0 0;gap:0;background:rgba(255,255,255,.1);border-radius:16px;position:relative;z-index:1}
.held .strook button{background:none;box-shadow:none;color:#fff;border-radius:0;padding:12px 10px}
.held .strook button + button{border-inline-start:1px solid rgba(255,255,255,.16)}
.held .strook span{color:rgba(255,255,255,.75)}
/* Menu: grote + in het midden */
.tabs button[data-v="vClients"]{display:none!important}
.tabs{align-items:flex-end}
.tabs button[data-v="vDay"]{order:1} .tabs button[data-v="vPlan"]{order:2} .tabs button.tab-plus{order:3} .tabs button[data-v="vFleet"]{order:4} .tabs button[data-v="meer"]{order:5}
.tabs button.tab-plus{color:var(--brand)!important}
.tabs button.tab-plus svg{width:30px;height:30px;padding:13px;box-sizing:content-box;border-radius:50%;background:var(--brand);color:#fff;stroke:#fff;stroke-width:2.6;margin-top:-26px;box-shadow:0 10px 22px -8px rgba(10,85,64,.7);border:4px solid var(--bg)}
/* Kaarten op Vandaag */
.kaartje{border:none;border-radius:20px;box-shadow:var(--sh);padding:16px 16px 14px}
.kaartje.laat{box-shadow:inset 5px 0 0 var(--warn),var(--sh)}
.kaartje .auto{font-size:18px}
.kaartje .wanneer{font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:99px;background:var(--line);color:var(--ink2)}
.kaartje .wanneer.vandaag{background:var(--gold-soft);color:var(--gold)}
.kaartje .wanneer.laat{background:var(--warn-soft);color:var(--warn)}
.kaartje .knoppen .btn{min-height:52px;border-radius:14px;font-size:16.5px}
/* Nieuw contract in drie stappen */
.nwvoortgang{display:flex;gap:6px;margin:-6px 0 18px}
.nwvoortgang .punt{flex:1;display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink3)}
.nwvoortgang .punt::before{content:"";height:5px;border-radius:99px;background:var(--line2)}
.nwvoortgang .punt.klaar::before, .nwvoortgang .punt.nu::before{background:var(--brand)}
.nwvoortgang .punt.nu{color:var(--brand)}
.nwvoortgang i{display:none}
.nwvoortgang .punt{display:grid;grid-template-columns:auto 1fr;column-gap:5px;align-items:center}
.nwvoortgang .punt::before{grid-column:1/3}
.nwvoortgang .punt.klaar i{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--brand);color:#fff;font-style:normal;font-size:10px;font-weight:900}
#vNew.nwwizard .vstap-k{display:none}
#vNew.nwwizard .vstap{border:none;background:none;box-shadow:none;overflow:visible}
#vNew.nwwizard .vstap-in{padding:0}
#vNew.nwwizard .title h1{font-size:32px}
#vNew.nwwizard #nwScanKaart{min-height:120px;font-size:20px;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
#vNew.nwwizard #nwScanKaart::before{content:"";width:42px;height:30px;border:3px solid currentColor;border-radius:7px;opacity:.9}
#vNew.nwwizard .tegels{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
#vNew.nwwizard .tegel{min-height:104px;padding:16px;border-radius:18px;border:2px solid transparent;box-shadow:var(--sh);display:flex;flex-direction:column;justify-content:space-between}
#vNew.nwwizard .tegel b{font-size:18px}
#vNew.nwwizard .tegel span{font-size:13.5px}
#vNew.nwwizard .tegel[aria-pressed="true"]{border-color:var(--brand)}
#vNew.nwwizard .dagknop{min-height:64px;font-size:18px;border-radius:16px}
#vNew.nwwizard .prijsregel{padding:18px;border-radius:18px;font-size:17px}
#vNew.nwwizard .prijsregel b{font-size:28px}
#vNew.nwwizard input[type="text"], #vNew.nwwizard input[type="tel"]{min-height:54px;font-size:17px}
.schud{animation:schud .35s}
@keyframes schud{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){ .schud{animation:none} }
/* ===== Beweging (alleen als het toestel beweging toelaat) ===== */
@media (prefers-reduced-motion:no-preference){
  .rise{animation:rise .35s cubic-bezier(.22,1,.36,1) both;animation-delay:var(--rise-delay,0s)}
  @keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
  /* 3. vinkje van een net afgeronde stap */
  .nwvoortgang .punt.klaar.net i{animation:tickpop .35s cubic-bezier(.34,1.56,.64,1) both}
  @keyframes tickpop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
  /* 7. Blur-in van het klaar-scherm; het vinkje popt pas daarna */
  #vDone.blur-in{animation:blurIn .4s cubic-bezier(.22,1,.36,1) both}
  @keyframes blurIn{from{opacity:0;filter:blur(8px)}to{opacity:1;filter:blur(0)}}
  #vDone.blur-in .title h1::before{animation:tickpop .3s cubic-bezier(.34,1.56,.64,1) .32s both}
  /* 6. Bar fill */
  .nwvoortgang .punt.vult::before, .prog-stappen button.vult::before{background:linear-gradient(var(--brand),var(--brand)) no-repeat 0 0/0% 100%,var(--line2);animation:vul .4s cubic-bezier(.22,1,.36,1) forwards}
  [dir="rtl"] .nwvoortgang .punt.vult::before, [dir="rtl"] .prog-stappen button.vult::before{background-position:100% 0}
  @keyframes vul{to{background-size:100% 100%}}
  /* 5. Slide-in */
  .slide-vooruit{--van:24px;animation:slideIn .35s cubic-bezier(.22,1,.36,1) both}
  .slide-terug{--van:-24px;animation:slideIn .35s cubic-bezier(.22,1,.36,1) both}
  [dir="rtl"] .slide-vooruit{--van:-24px} [dir="rtl"] .slide-terug{--van:24px}
  @keyframes slideIn{from{opacity:.4;transform:translateX(var(--van))}to{opacity:1;transform:none}}
  /* 4. Pop: indrukken = 0,96, loslaten = terugveren met een klein beetje overshoot */
  .btn, .held-knop, .tabs button.tab-plus svg{transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
  .btn:active:not(:disabled), .held-knop:active, .tabs button.tab-plus:active svg{transform:scale(.96);transition-duration:.08s}
}
/* Demo-balk */
.demobalk{position:fixed;left:0;right:0;top:0;z-index:80;display:flex;justify-content:center;align-items:center;gap:12px;padding:7px 14px;background:#1F2A24;color:#fff;font-size:13px;font-weight:600;text-align:center}
.demobalk a{color:#7FE0BA;font-weight:800;white-space:nowrap}
body.demo .bar{z-index:41}
/* Stap 4: betaling */
.betaalsom{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:6px 16px}
.betaalsom .rij{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:16px}
.betaalsom .rij:last-child{border-bottom:0}
.betaalsom .tot b{font-size:22px;color:var(--brand)}
.betaalkeuzes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.betaalkeuze{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:86px;border-radius:18px;border:2px solid transparent;background:var(--card);box-shadow:var(--sh);font:inherit;font-size:16px;font-weight:700;color:var(--ink);cursor:pointer}
.betaalkeuze .ico{font-size:26px;line-height:1}
.betaalkeuze[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
/* Nieuwe auto: kort formulier */
#cwMeer{display:none}
#vCar.kort #cwMeer{display:flex;justify-content:center}
#vCar.kort .two > div:first-child > .card:not(:first-child), #vCar.kort #cwSide{display:none}
/* Voorbeeldtekst in een vak mag niet lijken op iets dat al is ingevuld */
input::placeholder, textarea::placeholder{color:#B3BAB2;opacity:1}
/* Controlekaart na de scan */
#vNew.ctl-aan #nwDocWrap, #vNew.ctl-aan #nwLicWrap{display:none!important}
#vNew.ctl-aan #nwNewWrap > .f:first-child{display:none}
.controle{margin-top:14px;background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:16px}
.ctl-kop{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px;margin-bottom:12px}
.ctl-kop b{font-size:17px;font-family:"Bricolage Grotesque",Figtree,sans-serif}
html[lang="ar"] .ctl-kop b{font-family:"Noto Sans Arabic",Figtree,sans-serif}
.ctl-som{font-size:13px;font-weight:800;padding:4px 10px;border-radius:99px}
.ctl-som.ok{background:var(--brand-soft);color:var(--brand)} .ctl-som.warn{background:var(--gold-soft);color:var(--gold)} .ctl-som.bad{background:var(--warn-soft);color:var(--warn)}
.ctl-fotos{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}
.ctl-fotos button{flex:none;border:0;padding:0;background:none;cursor:zoom-in}
.ctl-fotos img{height:74px;border-radius:10px;display:block;box-shadow:var(--sh)}
.ctl-rij{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line)}
.ctl-lab{font-size:13px;font-weight:700;color:var(--ink2)}
.ctl-st{grid-row:1/3;grid-column:2;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:15px}
.ctl-st.ok{background:var(--brand-soft);color:var(--brand)} .ctl-st.warn{background:var(--gold-soft);color:var(--gold)} .ctl-st.bad{background:var(--warn-soft);color:var(--warn)} .ctl-st.leeg{background:var(--line);color:var(--ink3)}
.ctl-rij input{grid-column:1;min-height:44px;font-size:16px;font-weight:600}
.ctl-rij[data-s="warn"] input{border-color:var(--gold)} .ctl-rij[data-s="bad"] input{border-color:var(--warn)}
.ctl-why{grid-column:1/3;font-size:12.5px;font-weight:700;color:var(--gold)}
.ctl-rij[data-s="bad"] .ctl-why{color:var(--warn)} .ctl-why:empty{display:none}
/* Balk "Verwijderd · Annuleren" */
.herstel span{white-space:nowrap}
.herstel{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(122px + env(safe-area-inset-bottom,0px));z-index:75;display:flex;align-items:center;gap:16px;background:var(--ink);color:#fff;padding:10px 10px 10px 18px;border-radius:16px;box-shadow:0 14px 30px -12px rgba(0,0,0,.5);font-weight:600;max-width:calc(100% - 32px);animation:herstelIn .2s ease-out}
.herstel button{border:none;background:rgba(255,255,255,.14);color:#7FE0BA;font:inherit;font-weight:800;padding:9px 14px;border-radius:11px;cursor:pointer;white-space:nowrap}
@keyframes herstelIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){ .herstel{animation:none} }
/* ===== Groot scherm: één rustige kolom in het midden (zoals WhatsApp Web) ===== */
@media (min-width:760px){
  .bar-in, .prog, .wrap, .dock-in{max-width:680px}
  .wrap .two{display:flex!important;flex-direction:column;gap:14px}
  #vDone #rSide, #vCar #cwSide{order:-1}
  .tabs{left:50%!important;right:auto!important;width:680px;transform:translateX(-50%);border-radius:22px 22px 0 0}
  .dock{background:transparent;border-top:0;backdrop-filter:none}
  .dock-in{background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-radius:22px;padding:10px 12px;box-shadow:var(--sh)}
}
/* Contract (PDF): het kenteken stond leeg. html2canvas tekent de plaat-opmaak van
   het scherm niet; op het blad is het gewone tekst, links-naar-rechts. */
#sheet .plate{display:inline-flex;direction:ltr;unicode-bidi:normal;gap:6px;border:0;padding:0;font-family:inherit;font-size:inherit;background:none}
#sheet .plate bdi, #sheet .plate i{display:inline-block;unicode-bidi:normal}
/* Klaar-scherm: een groen vinkje als moment van succes, zoals een betaalapp. */
#vDone .title h1::before{content:"\2713";display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--brand);color:#fff;font-size:22px;font-weight:800;margin-inline-end:12px;vertical-align:-6px;box-shadow:0 8px 18px -8px rgba(10,85,64,.7)}
/* ===== Auto meegeven / terugnemen: zelfde stijl als het nieuwe contract ===== */
.prog-row b{font-size:13px;color:var(--ink3);font-weight:700}
.prog .track{display:none}
.prog-stappen{gap:6px;overflow:visible}
.prog-stappen button{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:6px;background:none!important;border:0!important;padding:0;color:var(--ink3)!important;font-size:12px;font-weight:700;white-space:normal;line-height:1.25;text-align:start}
.prog-stappen button::before{content:"";align-self:stretch;height:5px;border-radius:99px;background:var(--line2)}
.prog-stappen button.af::before, .prog-stappen button.nu::before{background:var(--brand)}
.prog-stappen button.nu{color:var(--brand)!important}
.prog-stappen button em{display:none}
#vForm .title h1{font-size:30px}
#vForm .title p{font-size:14.5px}
#vForm .card{border-radius:22px}
#vForm .chead .step{display:none}
#vForm .chead h2{font-size:21px}
#vForm .canvasbox{border-radius:18px}
#vForm .confirm{min-height:56px;border-radius:16px;font-size:16px;border-style:solid}
#vForm .confirm.done{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
/* ===== Rust (ronde 3): zoals Square en Airbnb =====
   Geen uitlegzinnen onder de titels, geen kleine lettertjes onderaan, kopjes in
   gewone zinnen in plaats van HOOFDLETTERS. Het klantscherm (scanner) blijft zoals
   het was. */
#vPlan .title p, #vClients .title p, #vFleet .title p, #vLed .title p, #vCash .title p, #vSet .title p, #vCar .title p, #vNew .title p{display:none}
#ledFine, #cashFine, #stFine{display:none}
.sh{text-transform:none;letter-spacing:-.01em;font-size:18px;font-weight:800;color:var(--ink);margin:26px 2px 10px}
.wrap > div:not(#vClient) .lbl{text-transform:none;letter-spacing:0;font-size:13.5px;font-weight:600;color:var(--ink2)}
.stgroep{margin-bottom:12px}
.stgroep .ch{font-size:17px;margin-bottom:12px}
/* Vandaag: kaartkop is zelf een knop (contract / wijzigen) */
.kaartje .kaartkop{display:block;width:100%;background:none;border:none;padding:0;font:inherit;color:inherit;text-align:start;cursor:pointer;position:relative;padding-inline-end:18px}
.kaartje .kaartkop .boven, .kaartje .kaartkop .wie{display:flex}
.kaartje .kaartkop .boven{justify-content:space-between;gap:10px;align-items:baseline}
.kaartje .kaartkop .chev{position:absolute;inset-inline-end:0;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:20px}
.kaartje .knoppen .btn{width:100%}
/* Ochtendstrook op Vandaag */
.strook{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 4px}
.strook button{background:var(--card);border:none;border-radius:var(--rs);box-shadow:var(--sh);padding:12px 12px 11px;text-align:start;font:inherit;color:inherit;cursor:pointer;min-width:0}
.strook b{display:block;font-family:"Bricolage Grotesque",Figtree,sans-serif;font-size:19px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[lang="ar"] .strook b{font-family:"Noto Sans Arabic",Figtree,sans-serif}
.strook span{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px;line-height:1.25}
.strook b.lang{font-size:15.5px;letter-spacing:-.02em;text-overflow:clip}
/* Rustige regels onderaan Vandaag */
.onderaan{margin-top:26px;border-top:1px solid var(--line)}
.voetregel{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;background:none;border:none;border-bottom:1px solid var(--line);padding:14px 2px;font:inherit;font-size:14.5px;color:var(--ink2);text-align:start;cursor:pointer}
.voetregel .chev{color:var(--ink3);font-size:18px}
/* Borg op maat: kop erboven, vier knoppen op één rij. */
.borgen{flex-wrap:nowrap!important}
.borgen .lbl{display:none}
.borgen .dagknop{flex:1 1 0;min-width:0;padding-left:4px;padding-right:4px;font-size:14px;white-space:nowrap}
[dir="rtl"] .planwrap, [dir="rtl"] .plan-nav{direction:ltr}
/* Een Marokkaanse plaat leest altijd: nummer · letter · regio, van links naar rechts. */
[dir="rtl"] .plate{direction:ltr}
/* Kentekens, bedragen en nummers blijven leesbaar in hun eigen richting. */
[dir="rtl"] input[type="tel"], [dir="rtl"] input[type="number"], [dir="rtl"] input[type="email"], [dir="rtl"] input[type="url"]{direction:ltr;text-align:right}
/* ---- Stijl Majorelle, verfijnd: blauw van de Jardin Majorelle, saffraan alleen voor de
   hoofdactie, zand als grond. Geen dikke randen of blokschaduwen: een haarlijn en een
   zachte schaduw, zoals een bankapp. ---- */
:root{
  --bg:#F7F4EE; --ink:#14161F; --ink2:#44464F; --ink3:#5A5C66;
  --line:#E8E2D6; --line2:#D6CEBF; --rand:#8A8270; --focus:#2F4AD0;
  --brand:#2F4AD0; --brand-2:#2439B0; --brand-soft:#EBEFFC;
  --warn:#A33A24; --warn-soft:#F9E7E1; --gold:#7A4F00; --gold-soft:#FBF0D6;
  --saffraan:#F2B233;
  --rc:16px; --rs:12px;
  --sh:0 0 0 1px rgba(20,22,31,.06), 0 1px 2px rgba(20,22,31,.04), 0 8px 24px -16px rgba(20,22,31,.22);
}
.held{background:linear-gradient(165deg,#3653DA 0%,#2F4AD0 55%,#2741BF 100%);border-radius:20px;box-shadow:0 18px 40px -24px rgba(36,57,176,.75)}
.held::after{display:none}
.held-knop{background:var(--saffraan);color:var(--ink);border-radius:14px;box-shadow:0 6px 16px -8px rgba(122,79,0,.55)}
.held .strook{background:rgba(255,255,255,.12)}
.btn{border-radius:var(--rs)}
.wa{border-radius:var(--rs)}
.kaartje.laat{box-shadow:inset 0 0 0 1.5px var(--warn),var(--sh)}
.tabs{background:rgba(255,255,255,.96);border-top:1px solid var(--line)}
.tabs button{color:var(--ink3)!important}
.tabs button[aria-current="true"]{color:var(--brand)!important}
.tabs button.tab-plus{color:var(--ink3)!important}
.tabs button.tab-plus svg{border-radius:16px;background:var(--brand);stroke:#fff;border:none;box-shadow:0 10px 22px -10px rgba(36,57,176,.8)}
.dock{background:rgba(247,244,238,.95)}
.demobalk{background:var(--ink)}
.demobalk a,.herstel button{color:var(--saffraan)}
.betaalkeuze .ico{display:grid;place-items:center;color:var(--ink2)}
.betaalkeuze[aria-pressed="true"] .ico{color:var(--brand)}
/* Verwijderen is geen hoofdactie: een rustige tekstlink, niet even groot als de rest. */
#delContract{background:none;box-shadow:none;font-size:15px;font-weight:600;padding:12px 8px;text-decoration:underline;text-underline-offset:3px}
</style>

async function sbRoep(pad,opt){
  opt=opt||{};
  var h={ "apikey":SB.key, "Content-Type":"application/json" };
  if(opt.headers) for(var k in opt.headers) h[k]=opt.headers[k];
  if(SBSES && SBSES.access_token) h.Authorization="Bearer "+SBSES.access_token;
  /* Een verbinding die blijft hangen (slechte 4G, wifi die wegvalt) mag de rij niet
     minutenlang vasthouden: na 15 seconden opgeven, dan probeert de volgende ronde het. */
  var stop=(typeof AbortController!=="undefined")?new AbortController():null;
  var wekker=stop?setTimeout(function(){ try{ stop.abort(); }catch(e){} },opt.wacht||15000):null;
  var res;
  try{ res=await fetch(sbBasis()+pad,{ method:opt.method||"GET", headers:h, body:opt.body, signal:stop?stop.signal:undefined }); }
  finally{ if(wekker) clearTimeout(wekker); }
  /* Een verlopen sleutel is geen storing: één keer vernieuwen en opnieuw proberen. */
  if(res.status===401 && SBSES && SBSES.refresh_token && !opt.nogmaals){
    if(await sbVernieuw()){ opt.nogmaals=true; return sbRoep(pad,opt); }
  }
  return res;
}
async function sbVernieuw(){

    var res=await fetch(sbBasis()+"/auth/v1/token?grant_type=refresh_token",
      { method:"POST", headers:{ "apikey":SB.key, "Content-Type":"application/json" },
        body:JSON.stringify({ refresh_token:SBSES.refresh_token }) });
    if(!res.ok){ SBSES=null; sbBewaarSes(); return false; }
    SBSES=await res.json(); sbBewaarSes(); return true;
  }catch(e){ return false; }
}

/* De verbinding nakijken en in gewone taal zeggen wat er nog moet gebeuren. Zonder
   dit staart de verhuurder naar een foutcode en weet hij niet wat hij fout doet. */
/* De verbinding nakijken zoals de echte Supabase zich gedraagt. Belangrijk: met
   beveiliging aan geeft een lezing zonder aanmelden gewoon een LEGE lijst terug
   (200), geen weigering. Of de tabel echt afgeschermd is, zie je pas als je
   zonder aanmelden iets probeert te SCHRIJVEN: dat moet geweigerd worden. */
async function sbTest(){
  var t=T();
  if(!sbBasis() || !SB.key) return { stap:"leeg", tekst:t.sbTest0 };
  if(!/^https?:\/\/[^\s\/]+/.test(sbBasis())) return { stap:"url", tekst:t.sbTestUrl };
  /* Een afgekapte sleutel ("…") of een met spaties is de meest gemaakte fout. */
  if(/[^\x21-\x7e]/.test(SB.key) || SB.key.length<20) return { stap:"sleutel", tekst:t.sbTestSleutel };
  var kaal={ "apikey":SB.key, "Content-Type":"application/json" };
  var res, j;
  try{ res=await fetch(sbBasis()+"/rest/v1/atlas?select=path&limit=1",{ headers:kaal }); }
  catch(e){ return { stap:"net", tekst:t.sbTestNet }; }
  j=null; try{ j=await res.clone().json(); }catch(e){}
  var tekst=String((j&&(j.code||""))+" "+(j&&(j.message||j.msg||j.hint||""))||"");
  if(/api key/i.test(tekst) || (res.status===401 && !/42501|JWT/i.test(tekst))) return { stap:"sleutel", tekst:t.sbTestSleutel };
  if(res.status===404 || /PGRST205|does not exist|schema cache/i.test(tekst)) return { stap:"tabel", tekst:t.sbTestTabel };
  if(!res.ok && res.status!==401 && res.status!==403) return { stap:"net", tekst:t.sbTestNet+" (HTTP "+res.status+")" };
  /* Schrijven zonder aanmelden moet mislukken. */
  var proef="settings/proef-"+Date.now(), res0;
  try{
    res0=await fetch(sbBasis()+"/rest/v1/atlas",{ method:"POST", headers:kaal,
      body:JSON.stringify({ path:proef, data:{proef:true}, updated_at:new Date().toISOString() }) });
  }catch(e){ return { stap:"net", tekst:t.sbTestNet }; }
  if(res0.ok){
    /* Ging erdoor: de beveiliging staat uit. Proefrij meteen weer weg. */
    try{ await fetch(sbBasis()+"/rest/v1/atlas?path=eq."+encodeURIComponent(proef),{ method:"DELETE", headers:kaal }); }catch(e){}
    return { stap:"open", tekst:t.sbTestOpen };
  }
  if(!SBSES) return { stap:"ok-uit", tekst:t.sbTestKlaar };
  /* Aangemeld: kan deze gebruiker er echt bij? */
  var res2=await sbRoep("/rest/v1/atlas?select=path&limit=1");
  if(res2.status===404) return { stap:"tabel", tekst:t.sbTestTabel };
  if(!res2.ok) return { stap:"rechten", tekst:t.sbTestRechten(res2.status) };
  var res3=await sbRoep("/rest/v1/atlas",{ method:"POST", headers:{ "Prefer":"resolution=merge-duplicates" },
    body:JSON.stringify({ path:proef, data:{proef:true}, updated_at:new Date().toISOString() }) });
  if(!res3.ok) return { stap:"schrijven", tekst:t.sbTestSchrijven(res3.status) };
  await sbRoep("/rest/v1/atlas?path=eq."+encodeURIComponent(proef),{ method:"DELETE" });
  return { stap:"goed", tekst:t.sbTestGoed };
}

/* Supabase antwoordt in technisch Engels. De verhuurder moet lezen wat hij moet DOEN. */
function sbUitleg(fout){
  var t=T(), f=String(fout||"");
  if(/not authorized|email_address_not_authorized/i.test(f)) return t.sbFoutMailVerbod;
  if(/rate limit|over_email_send/i.test(f)) return t.sbFoutTeVeel;
  if(/at least 6|weak_password|password should/i.test(f)) return t.sbFoutKort;
  if(/already registered|user_already_exists|already been registered/i.test(f)) return t.sbFoutBestaat;
  if(/signups? not allowed|signup_disabled/i.test(f)) return t.sbFoutGeenNieuw;
  if(/invalid login|invalid_credentials/i.test(f)) return t.sbFoutLogin;
  if(/email not confirmed|email_not_confirmed/i.test(f)) return t.sbFoutBevestig;
  if(/api key|ISO-8859-1|non ISO|headers/i.test(f)) return t.sbTestSleutel;
  if(/invalid.*email|validation_failed|unable to validate email/i.test(f)) return t.sbFoutMail;
  if(/failed to fetch|networkerror|load failed/i.test(f)) return t.sbTestNet;
  return t.stCloudMis(f);
}

function sbZet(pad,d){ if(!sbKlaar()||!sbInMap(pad)) return; SBQ.push({op:"set",path:pad,data:d,t:Date.now()}); sbBewaarRij(); sbWerk(); }
function sbWis(pad){ if(!sbKlaar()||!sbInMap(pad)) return; SBQ.push({op:"del",path:pad,t:Date.now()}); sbBewaarRij(); sbWerk(); }

/* De rij afwerken. Lukt iets niet, dan blijft het vooraan staan en proberen we het
   later opnieuw — nooit overslaan, want dan zou een wijziging stil verdwijnen. */
async function sbWerk(){
  if(SBBEZIG || !sbKlaar() || !SBQ.length) return;
  SBBEZIG=true; SBSTAT="bezig"; sbVerf();
  try{
    while(SBQ.length){
      var o=SBQ[0], res;
      if(o.op==="set"){
        res=await sbRoep("/rest/v1/atlas",{ method:"POST", headers:{ "Prefer":"resolution=merge-duplicates" },
          body:JSON.stringify({ path:o.path, data:o.data, updated_at:new Date(o.t).toISOString() }) });
      } else {
        res=await sbRoep("/rest/v1/atlas?path=eq."+encodeURIComponent(o.path),{ method:"DELETE" });
      }
      if(!res.ok){ SBFOUT="HTTP "+res.status; SBSTAT="fout"; break; }
      SBQ.shift(); sbBewaarRij();
    }
    if(!SBQ.length){ SBSTAT="aan"; SBFOUT=""; }
  }catch(e){ SBFOUT=String(e&&e.message||e); SBSTAT="fout"; }
  SBBEZIG=false; sbVerf();
}

/* Ophalen mag alleen als alles van dit toestel al verstuurd is; anders zouden we
   een wijziging die nog in de rij staat overschrijven met een oudere versie. */
async function sbHaal(){
  if(!sbKlaar() || SBQ.length || SBBEZIG) return false;
  try{
    var res=await sbRoep("/rest/v1/atlas?select=path,data");
    if(!res.ok){ SBFOUT="HTTP "+res.status; SBSTAT="fout"; sbVerf(); return false; }
    var rijen=await res.json(), vers={};
    rijen.forEach(function(r){ if(r && r.path) vers[r.path]=r.data; });
    /* Wat niet meegaat naar de cloud (taal, schetsen) blijft staan zoals het is. */
    Object.keys(local).forEach(function(pad){ if(!sbInMap(pad)) vers[pad]=local[pad]; });
    local=vers; saveLocal();
    SBSTAT="aan"; SBFOUT=""; sbVerf(); return true;
  }catch(e){ SBFOUT=String(e&&e.message||e); SBSTAT="fout"; sbVerf(); return false; }
}
/* Ophalen én het scherm bijwerken, zodat een verhuur die op de laptop is gemaakt
   op de telefoon vanzelf verschijnt. */
async function sbRond(){
  if(!sbKlaar()) return;
  await sbWerk();
  if(await sbHaal()){ try{ await reload(); render(); }catch(e){} }
}
/* Eerste keer aanmelden op een toestel: alles wat hier al stond en nog niet in de
   cloud zit, gaat erbij. Wat al in de cloud staat, blijft zoals het is. Zo gaat
   er bij het aanmelden nooit iets verloren, op geen enkel toestel. */
async function sbSamenvoegen(){
  if(!sbKlaar()) return;
  try{
    var res=await sbRoep("/rest/v1/atlas?select=path");
    if(!res.ok) return;
    var inCloud={}; (await res.json()).forEach(function(r){ if(r&&r.path) inCloud[r.path]=1; });
    var nu=Date.now();
    Object.keys(local).forEach(function(pad){ if(sbInMap(pad) && !inCloud[pad]) SBQ.push({op:"set",path:pad,data:local[pad],t:nu}); });
    sbBewaarRij(); await sbWerk();
  }catch(e){}
}

/* In het Arabisch (van rechts naar links) blijven bedragen, kilometers en datums
   één blok dat van links naar rechts leest: anders schuift "450 DH" door de zin

function ltr(x){ return L==="ar" ? "\u2066"+x+"\u2069" : x; }

function kmf(n){ return ltr((Number(n)||0).toLocaleString(T().loc)+" km"); }

function plateDoc(c){ return '<bdi dir="ltr">'+[c.plateNum,c.plateLtr,c.plateReg].filter(Boolean).map(function(x){ return "<bdi>"+esc(x)+"</bdi>"; }).join(" \u00b7 ")+"</bdi>"; }

function dShort(d){ return datum(new Date(d.slice(0,10)+"T12:00:00Z").toLocaleDateString(T().loc,{day:"2-digit",month:"2-digit",year:"2-digit",timeZone:"UTC"})); }
/* Arabische datums: de onzichtbare richtingstekens eruit (die draaiden 22/10/26
   om tot 26/10/22). Alleen cijfers: één blok van links naar rechts. Met een
   Arabische maandnaam: één blok van rechts naar links. */
function datum(x){
  if(L!=="ar") return x;
  x=x.replace(/[\u200e\u200f\u061c]/g,"");
  return /[\u0600-\u06ff]/.test(x) ? "\u2067"+x+"\u2069" : ltr(x);

   rijbewijs. Maar wat de vórige scan invulde mag niet blijven staan als de volgende

var IDVELDEN=["cvName","cvBirth","cvNat","cvDocNo","cvDocExp","cvAddr"];

function wisAutoVelden(ids){

    if(e.dataset && e.dataset.auto==="1"){ e.value=""; delete e.dataset.auto; delete e.dataset.vast; e.classList.remove("check"); }
    was[id]=e.value; });

   de kaart. Zodra dat er staat mag geen enkele tekstherkenning het nog overschrijven. */
function zetVast(id){ var e=$(id); if(e && e.dataset) e.dataset.vast="1"; }
function isVast(id){ var e=$(id); return !!(e && e.dataset && e.dataset.vast==="1" && e.value); }

/* ============ MRZ: de regels met <<< onderaan een paspoort of moderne ID ============
   Gestandaardiseerd (ICAO 9303) en met controlegetallen: klopt de som niet, dan vullen
   we niets in. Zo kan er nooit een verkeerd nummer of verkeerde datum in het dossier. */
function mrzCheck(str){
  var w=[7,3,1], s=0;
  for(var i=0;i<str.length;i++){
    var ch=str[i], v;
    if(ch>="0"&&ch<="9") v=ch.charCodeAt(0)-48;
    else if(ch>="A"&&ch<="Z") v=ch.charCodeAt(0)-55;
    else if(ch==="<") v=0; else return -1;
    s+=v*w[i%3];
  }
  return s%10;
}
/* Streng: een verplicht veld zonder echt controlecijfer is NIET goedgekeurd.
   Alleen het optionele persoonsnummer mag leeg (<) zijn. */
function mrzOk(field,digit,optional){

    if(!hit){

      if(n===36 && half.length===2) half[0]=half[0].slice(0,5)+applyPattern(half[0].slice(5),PAT.name);
      hit=fixWithChecks(half);

    if(!hit) hit=fixWithChecks(txt);
      if(hit) hitG=hit;

         het nog proberen; de vollediger lezing wint. */
      if(compleet(hitG)){ GLYPHS=sets[0]; return hitG; }
      if(!halveTreffer) halveTreffer=hitG;

    }
  }
  }
  GLYPHS=sets[0];
  return halveTreffer;
}

/* Draai de hele foto recht, zonder verder iets te doen. Daarna ligt een schuin gehouden

function rotatedSource(img,ang){
  if(!ang) return img;
  var c=document.createElement("canvas");
  c.width=img.width; c.height=img.height;
  var x=c.getContext("2d");
  x.fillStyle="#ffffff"; x.fillRect(0,0,c.width,c.height);
  x.translate(c.width/2,c.height/2); x.rotate(-ang*Math.PI/180); x.translate(-c.width/2,-c.height/2);
  x.drawImage(img,0,0);
  return c;
}
/* Zoek de strook met de machineleesbare regels: twee of drie regels van gelijke hoogte,
   dicht bij elkaar, onderaan het document. Daarna zoomen we daar op in, zodat elk lettertje
   genoeg beeldpunten krijgt — dat is waar een foto van een afstand op stukloopt. */
function bandRect(img,rect,ang){
  var cv=mrzCanvas(img,false,ang,0,rect);
  var W=cv.width, H=cv.height;
  var d=cv.getContext("2d").getImageData(0,0,W,H).data, px=new Uint8Array(W*H);
  for(var k=0,p=0;k<d.length;k+=4,p++) px[p]=d[k]<128?1:0;
  var lines=findLines(px,W,H); if(lines.length<2) return null;
  function groupOk(g){
    var hs=g.map(function(L){ return L[1]-L[0]; });
    var mn=Math.min.apply(null,hs), mx=Math.max.apply(null,hs);
    if(mx>mn*1.8) return false;                       /* regels moeten even hoog zijn */
    for(var i=1;i<g.length;i++){
      var gap=g[i][0]-g[i-1][1];
      if(gap>mx*1.6 || gap<-2) return false;          /* en dicht bij elkaar staan */
    }

  }
  var best=null;
  for(var need=3; need>=2; need--){
    for(var st=lines.length-need; st>=0; st--){
      var g=lines.slice(st,st+need);
      if(groupOk(g) && g[0][0] > H*0.35){ best=g; break; }   /* onderin het document */
    }
    if(best) break;
  }

  var R=rect||{x:0,y:0,w:img.width,h:img.height};
  var f0=best[0][0]/H, f1=best[best.length-1][1]/H, padf=(f1-f0)*0.35;
  var y0=Math.max(0,R.y+Math.round((f0-padf)*R.h)), y1=Math.min(img.height,R.y+Math.round((f1+padf)*R.h));

}

/* Probeer de MRZ van de foto te lezen: eerst de onderrand, dan de hele foto. Snel; faalt stil. */
function tick(){ return new Promise(function(r){ setTimeout(r,0); }); }
/* Tussen twee pogingen even het scherm teruggeven houdt de app levend. Maar een
   browser rekt zo'n pauze op tot een hele seconde zodra het tabblad naar de
   achtergrond gaat — dan duurt een scan van honderd pogingen ineens minuten.
   Dus: alleen ademhalen als er echt iets te tonen is (het tabblad staat vooraan)
   en hoogstens een paar keer per seconde, ongeacht hoeveel pogingen er zijn. */
function ademHaler(){
  var laatst=0;
  return async function(){
    try{ if(document.hidden) return; }catch(e){}
    var nu=Date.now();
    if(nu-laatst<140) return;
    laatst=nu;
    await tick();

/* De naam heeft geen controlecijfer, dus komt de zekerheid van herhaling. Eisen dat
   drie pogingen exact dezelfde naam opleveren is streng: één letter verschil en alles
   valt af. Daarom kijken we ook per letter. Bij "OUARPAT / OUARRAT / OUARRAT" is de
   vierde letter twee keer R en één keer P — dan is R het antwoord. Alleen als élke
   letter zo'n duidelijke meerderheid heeft, vullen we de naam in. */
function naamConsensus(lijst){
  if(!lijst || lijst.length<3) return "";
  var perLen={};
  lijst.forEach(function(n){ (perLen[n.length]=perLen[n.length]||[]).push(n); });
  var L=Object.keys(perLen).sort(function(a,b){ return perLen[b].length-perLen[a].length; })[0];
  var groep=perLen[L];
  if(!groep || groep.length<3) return "";
  var uit="";
  for(var i=0;i<Number(L);i++){
    var tel={}, beste=null;
    for(var j=0;j<groep.length;j++){ var c=groep[j].charAt(i); tel[c]=(tel[c]||0)+1;
      if(!beste || tel[c]>tel[beste]) beste=c; }
    if(tel[beste] < groep.length*0.6) return "";

  }
