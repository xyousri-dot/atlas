}
/* Het gedrukte nummer op een identiteitskaart staat in het vrije veld van de strook
   en wordt afgesloten met « < ». Wordt zo'n « < » als cijfer gelezen, dan krijg je
   een nummer met één cijfer te veel. Daarom laten we ook hier de pogingen stemmen:
   per teken, en over de lengte die het vaakst voorkomt. */

  if(!lijst || lijst.length<minAantal) return "";

  lijst.forEach(function(n){ (perLen[n.length]=perLen[n.length]||[]).push(n); });

     teken kan wegvallen of erbij verzonnen worden, en te veel is hier de fout */
  var L=Object.keys(perLen).sort(function(a,b){
    return (perLen[b].length-perLen[a].length) || (Number(a)-Number(b)); })[0];
  var groep=perLen[L];
  if(!groep || groep.length<minAantal) return "";
  var uit="";
  for(var i=0;i<Number(L);i++){
    var tel={}, beste=null;
    for(var j=0;j<groep.length;j++){ var c=groep[j].charAt(i); tel[c]=(tel[c]||0)+1;
      if(!beste || tel[c]>tel[beste]) beste=c; }
    if(tel[beste] < groep.length*0.6) return "";
    uit+=beste;
  }

}
function keurAlt(hit,lijst){
  if(!hit || !hit.altNumber || !lijst || !lijst.length) return hit;
  /* Alleen lezingen die de vorm van een CIN-nummer hebben tellen mee (letters,
     dan cijfers). "GI45H9" is geen nummer, hoe vaak het ook gelezen is. */
  var goed=lijst.filter(function(a){ return CINNR.test(a); });
  if(!goed.length) return hit;
  var tel={}, beste=goed[0];
  goed.forEach(function(a){ tel[a]=(tel[a]||0)+1; if(tel[a]>tel[beste]) beste=a; });
  var c=lijstConsensus(goed,2);
  hit.altNumber = (c && CINNR.test(c)) ? c : beste;

  hit.altShaky = (tel[hit.altNumber]||0) < 3;

/* In een Marokkaanse naam komt de letter V zo goed als nooit voor: de klank "ou"

   Marokkaans document is een V in de naam dus bijna zeker een verkeerd gelezen U.

function keurNaam(hit,namen,lijst,sets,lijstFont){

  var c=naamConsensusStreng(lijst,4,0.7);

function naamConsensusStreng(lijst,minAantal,drempel){
  if(!lijst || lijst.length<minAantal) return "";
  var perLen={};
  lijst.forEach(function(n){ (perLen[n.length]=perLen[n.length]||[]).push(n); });
  var L=Object.keys(perLen).sort(function(a,b){ return perLen[b].length-perLen[a].length; })[0];
  var groep=perLen[L];
  if(!groep || groep.length<minAantal) return "";
  var uit="";
  for(var i=0;i<Number(L);i++){
    var tel={}, beste=null;
    for(var j=0;j<groep.length;j++){ var ch=groep[j].charAt(i); tel[ch]=(tel[ch]||0)+1; if(!beste||tel[ch]>tel[beste]) beste=ch; }
    if(tel[beste] < groep.length*drempel) return "";

/* Een naam heeft klinkers, en niet drie keer dezelfde letter achter elkaar. */
function naamGeloofwaardig(n){
  var w=String(n||"").replace(/\s/g,"");

  var klink=(w.match(/[AEIOUY]/g)||[]).length;
  return klink>=w.length*0.2;

/* Een document ligt vaak een kwartslag gedraaid in het beeld: een gescande PDF,
   een telefoon die zijwaarts werd gehouden, een pagina die staand is opgeslagen.
   De regels lopen dan verticaal en er valt horizontaal niets te vinden. Daarom
   proberen we het beeld ook een kwart-, half- en driekwartslag gedraaid. */
function turnImage(img,deg){
  var w=img.width, h=img.height, staand=(deg===90||deg===270);
  var c=document.createElement("canvas");
  c.width = staand?h:w; c.height = staand?w:h;
  var x=c.getContext("2d");
  x.translate(c.width/2,c.height/2); x.rotate(deg*Math.PI/180);
  x.drawImage(img,-w/2,-h/2);

/* In welke richting staat het document? We binariseren het beeld klein in vier
   standen en tellen hoeveel dunne, brede tekstregels er te vinden zijn. Bij de
   juiste stand zijn dat er duidelijk meer. Zo hoeven we niet alle vier de standen
   helemaal door te rekenen. */
function besteDraai(img){
  var best=0, bestScore=-1, scores={};
  [0,90,180,270].forEach(function(deg){
    try{
      var src = deg? turnImage(img,deg) : img;
      var cv = mrzCanvas(src,false,0,0,null,1100);
      var W=cv.width,H=cv.height,d=cv.getContext("2d").getImageData(0,0,W,H).data;
      var px=new Uint8Array(W*H);
      for(var k=0,q=0;k<d.length;k+=4,q++) px[q]=d[k]<128?1:0;
      var ls=findLines(px,W,H), score=0;

         Staat het document verkeerd om, dan levert lezen in die richting bijna
         geen «<» op. Dat onderscheidt veel scherper dan alleen regels tellen. */
      if(!GLYPHS) GLYPHS=buildGlyphSet();
      var kijk=ls.slice(-4);

        var h=kijk[i][1]-kijk[i][0];
        if(h<H*0.003 || h>H*0.06) continue;
        [44,30,36].forEach(function(n){
          var r=readLine(px,W,kijk[i][0],kijk[i][1],n);
          if(!r) return;
          var c=(r.text.match(/</g)||[]).length;
          if(c>score) score=c;
        });
      }
      scores[deg]=score;
      if(score>bestScore){ bestScore=score; best=deg; }
    }catch(e){}
  });

     een klein verschil is toeval en dan zou draaien een prima foto bederven. */
  var s0=scores[0]||0;
  if(best!==0 && !(bestScore>=8 && bestScore>s0*1.6)) best=0;
  return best;
}

/* ============ GEDRUKTE TEKST OP DE KAART LEZEN ============

    if(alleenCijfers && CIJFERSET.indexOf(g.ch)<0) continue;
    for(k=0;k<N;k++){ var dv=sh.g[k]-g.g[k]; v += dv<0?-dv:dv; }

/* Tekens losknippen op de witruimte. Gedrukte tekst heeft geen vaste vakjes, dus

        for(var t2=mik-r;t2<=mik+r;t2++){

      grens.push(b);
      for(var g2=0;g2+1<grens.length;g2++) uit.push([grens[g2],grens[g2+1]]);

function fillFromMRZ(hit,storedKey){

    if(hit.issue && !$("cvLicIssue").value){ $("cvLicIssue").value=hit.issue; markCheck("cvLicIssue"); }

  if(hit.nationality && echtLand(hit.nationality)) $("cvNat").value=hit.nationality;

    if(hit.docNumber){ $("cvLic").value=hit.docNumber; if(hit.docShaky) SCANTWIJFEL.licenceNumber=true; }
    if(hit.expiry) $("cvLicExp").value=hit.expiry;

/* De band met gedrukte tekst boven de strook: daar staat het adres. De hoogte
   van de strook zegt hoe groot de kaart is (de strook is ongeveer een vijfde van
   de kaarthoogte), dus we kunnen precies uitrekenen hoe ver we omhoog moeten. */
function adresBandUitAnker(){
  if(!ANKER || !ANKER.strook) return null;
  var st=ANKER.strook, bron=ANKER.bron;
  var hoog=Math.max(20,st.h);
  /* De adresregel staat vlak boven de strook. De strookzoeker begint zijn vlak een
     klein stukje boven de eerste letterrij, dus we lopen iets door in de strook en
     nemen daarboven één kaarthoogte mee: daar valt de adresregel altijd in. */
  var y1=Math.round(st.y+hoog*0.30), y0=Math.round(st.y-hoog*0.85);
  if(y0<0) y0=0;
  if(y1-y0<20) return null;
  var x0=Math.max(0,Math.round(st.x-st.w*0.04)), x1=Math.min(bron.width,Math.round(st.x+st.w*1.04));

  var x=c.getContext("2d"); x.imageSmoothingEnabled=true; x.imageSmoothingQuality="high";
  x.drawImage(bron,x0,y0,x1-x0,y1-y0,0,0,c.width,c.height);
  return c;
}
async function adresBand(blob){

      var u=URL.createObjectURL(blob), m=new Image();
      m.onload=function(){ URL.revokeObjectURL(u); res(m); };
      m.onerror=function(){ URL.revokeObjectURL(u); rej(new Error("img")); }; m.src=u;
    });
    var hk=null; try{ hk=vindHoeken(img); }catch(e){ hk=null; }
    var vlak = hk ? vlakTrekken(img,hk,1800) : null;

    }

/* Elke foto krijgt eerst een eigen sleutel, zodat een tweede document nooit het eerste wist.

/* ============ ZELF DE REGELS AANDUIDEN ============

  var s=$("cropSel"), cv=$("cropCv");

  var f=cv.width/CROPIMG.width;
  var cr=cv.getBoundingClientRect(), pr=cv.parentNode.getBoundingClientRect();
  s.style.display="block";
  s.style.left=(cropSel.x*f+(cr.left-pr.left))+"px";
  s.style.top=(cropSel.y*f+(cr.top-pr.top))+"px";
  s.style.width=(cropSel.w*f)+"px";
  s.style.height=(cropSel.h*f)+"px";

async function scanDoc(file,tag){

  /* schoon beginnen: een kader of rapport van de vorige poging blijft anders staan

     iets van het vorige document staan als deze scan niets vindt. Alleen bij de
     kant met de machineleesbare strook: dat is de lezing die alles bepaalt. Een
     foto van de vóórkant of van het rijbewijs komt erbij en gooit nooit iets weg,
     want die hoort bij hetzelfde dossier. */
  var GROEP = (pickedDoc()==="licence") ? LICVELDEN : IDVELDEN;
  var WIS = (pickedDoc()!=="licence" && ZIJDE!=="voor");

    p.textContent=pre+msg; box.classList.remove("busy"); $("scanBtn").disabled=false; if($("scanLicBtn")) $("scanLicBtn").disabled=false;
    /* De uitkomst stond vaak buiten beeld omdat de verhuurder naar de vakjes
       gescrold was. Dan lijkt het alsof er niets gebeurt. */
    try{ p.scrollIntoView({behavior:"smooth",block:"center"}); }catch(e){}

    var pgs=[];

    if(!pgs.length){ done(t.scanPdfFail); return; }
    for(var pi=0;pi<pgs.length;pi++){
      var f2=new File([pgs[pi]],(file.name||"document").replace(/\.pdf$/i,"")+"-"+(pi+1)+".jpg",{type:"image/jpeg"});
      var last = pi===pgs.length-1;

      await scanDoc(f2, pgs.length>1 ? t.scanPage(pi+1,pgs.length) : tag);

        bewaard en zijn we meteen klaar — nooit wachten, nooit een dode knop. */
  /* Voorkant van een identiteitskaart: daar staat geen strook. Niet zoeken naar
     wat er niet is; meteen de tekstlezer erop, en de foto komt sowieso bij de
     klant te staan. */
  if(ZIJDE==="voor" && pickedDoc()!=="licence"){ await voorkantLezen(file,storedKey,done); return; }

  p.textContent=pre+t.scanBusy;

    var r=await SAMPLE.json(DOCPROMPT,{images:blob, cache:false});

/* ============ TEKST VAN DE TELEFOON PLAKKEN ============
   De tekstherkenning van Apple (Live Text) en die van Android lezen een kaart beter
   dan wat ik in een webpagina kan bouwen — ze zitten in het toestel zelf en zijn er
   jaren op getraind, ook op Arabisch. Aanroepen vanuit een webpagina kan niet, maar
   het resultaat gebruiken wel: de verhuurder selecteert de tekst op de foto, kopieert
   hem, en plakt hem hier. Wat hij plakt halen we uit elkaar met dezelfde controles
   als altijd — bij een machineleesbare strook zelfs met de controlecijfers, dus dan
   is het gegarandeerd juist of het wordt niet ingevuld. */
function mrzRegelsUit(tekst){
  var uit=[];
  String(tekst||"").split(/[\r\n]+/).forEach(function(r){
    var c=r.toUpperCase().replace(/[«»]/g,"<").replace(/\s+/g,"");
    c=c.replace(/[^A-Z0-9<]/g,"<");
    if(c.length>=28 && c.length<=46 && (c.match(/</g)||[]).length>=2) uit.push(c);
  });
  return uit;
}
function plakMRZ(tekst){
  var regels=mrzRegelsUit(tekst);
  /* de losse regel achterop een rijbewijs (D1…) is er maar één */
  for(var ri=0;ri<regels.length;ri++) if(/^D1/.test(regels[ri]) && regels[ri].length>=30){ var lic=parseMRZ(regels[ri]); if(lic) return lic; }
  if(regels.length<2) return null;
  for(var n=3;n>=2;n--){
    for(var i=0;i+n<=regels.length;i++){
      var hit=parseMRZ(regels.slice(i,i+n).join("\n"));
      if(hit) return hit;
    }
  }
  return parseMRZ(regels.join("\n"));
}
/* Geen strook in de geplakte tekst? Dan behandelen we hem als gewone regels —
   precies zoals de regels die de app zelf van een foto leest. */
function plakRegels(tekst){
  return String(tekst||"").split(/[\r\n]+/).map(function(r){
    return { tekst:r.toUpperCase().replace(/\s+/g," ").trim(), score:0.95 };
  }).filter(function(r){ return r.tekst.length>1; });
}
function adresUitPlak(regels){
  var gemerkt=regels.filter(function(r){ return /ADRE|ADDRESS|ADRESSE/i.test(r.tekst); })[0];
  if(gemerkt){
    var schoon=gemerkt.tekst.replace(/^.*?ADRE\w*\s*[:.]?\s*/i,"").trim();
    if(schoon.length>=8 && adresAchtig(schoon)) return schoon;
  }
  return adresUitRegels(regels);
}
async function plakVerwerken(){
  var t=T(), tekst=$("plakText").value, msg=$("plakMsg");
  if(!tekst || tekst.trim().length<8){ msg.textContent=t.plakLeeg; return; }
  var gedaan=verwerkTekst(tekst);
  msg.textContent = gedaan.length ? t.plakOk(gedaan.join(", ")) : t.plakNiets;
  if(gedaan.length) try{ msg.scrollIntoView({behavior:"smooth",block:"center"}); }catch(e){}
}
/* Eén verwerking voor alle tekst, waar die ook vandaan komt: geplakt van de
   telefoon, gelezen door Tesseract, of teruggekregen van OCR.space. Dezelfde
   controles, dezelfde regels over wat waar mag landen. */
function verwerkTekst(tekst){
  var t=T(), gedaan=[];
  /* Deze tekst komt van een herkenner zonder controlecijfer. Wat al door een
     controlecijfer bevestigd is, blijft staan. */
  var vastLic=isVast("cvLic"), vastDoc=isVast("cvDocNo");
  var hit=plakMRZ(tekst);
  /* De regel achterop een rijbewijs is geen identiteitsstrook: daar staat alleen
     het rijbewijsnummer in. Die hoort dus nooit in het vakje van de CIN of het
     paspoort terecht te komen. */
  if(hit && hit.kind==="licence"){
    if(!vastLic){ $("cvLic").value=hit.docNumber; zetVast("cvLic"); markCheck("cvLic"); gedaan.push(t.pLic); }
    if(hit.nationality && echtLand(hit.nationality) && !$("cvNat").value) $("cvNat").value=hit.nationality;
    hit=null;
  }
  if(hit){
    /* De strook draagt zijn eigen controlecijfers: wat hier binnenkomt is juist. */
    var was=pickedDoc();
    if(hit.kind==="passport") setPick("passport"); else if(hit.kind==="id") setPick("cin");
    if(hit.fullName){ hit.fullName=marokNaam(hit.fullName,hit); $("cvName").value=hit.fullName; gedaan.push(t.pName); }
    if(hit.birthDate){ $("cvBirth").value=hit.birthDate; gedaan.push(t.pBirth); }
    if(hit.nationality && echtLand(hit.nationality)){ $("cvNat").value=hit.nationality; gedaan.push(t.pNat); }
    var no=usableDocNo(pickedDoc(),hit.docNumber,hit.altNumber,hit.kind);
    if(no && !vastDoc){ $("cvDocNo").value=no; zetVast("cvDocNo"); gedaan.push(t.pDoc); }
    if(hit.expiry){ $("cvDocExp").value=hit.expiry; gedaan.push(t.pExp); }
    markCheck("cvDocNo");
  }
  var regels=plakRegels(tekst), soort=soortUitRegels(regels);
  /* De voorkant van een CIN: geen strook, wel "Né le", de naam erboven, het
     gedrukte nummer en "Valable jusqu'au". Daar halen we uit wat er staat. */
  if(!hit && soort==="id"){
    var vk=voorkantUitRegels(regels);
    if(vk.birth && !$("cvBirth").value){ $("cvBirth").value=vk.birth; gedaan.push(t.pBirth); }
    if(vk.expiry && !$("cvDocExp").value){ $("cvDocExp").value=vk.expiry; gedaan.push(t.pExp); }
    if(vk.number && !$("cvDocNo").value){ $("cvDocNo").value=vk.number; gedaan.push(t.pDoc); markCheck("cvDocNo"); }
    if(vk.name && !$("cvName").value){ $("cvName").value=vk.name; gedaan.push(t.pName); }
    if(pickedDoc()==="licence") setPick("cin");
  }
  if(!hit && soort==="licence"){
    var g=rijbewijsUitRegels(regels);
    if(g.number && !vastLic){ $("cvLic").value=g.number; gedaan.push(t.pLic); }
    /* De vergrendeling geldt alleen voor het nummer: de vervaldatum staat niet in
       de regel met controlecijfer en mag hier dus wél ingevuld worden. */
    if(g.expiry && !$("cvLicExp").value){ $("cvLicExp").value=g.expiry; gedaan.push(t.pLicExp); }
    if(g.birth && !$("cvBirth").value){ $("cvBirth").value=g.birth; gedaan.push(t.pBirth); }
    if(g.namen && g.namen.length && !$("cvName").value){ $("cvName").value=g.namen.slice(0,2).join(" "); gedaan.push(t.pName); }
    markCheck("cvLic");
  }
  /* Weten we niet wat het is, dan vullen we níets in de rijbewijsvelden. Een
     nummer dat uit ruis komt is erger dan een leeg vak. */
  /* Het adres staat nooit in de strook; wel vaak in de geplakte tekst. */
  if(!$("cvAddr").value && pickedDoc()!=="licence"){
    var adr=adresUitPlak(regels);
    if(adr){ $("cvAddr").value=adr; markCheck("cvAddr"); gedaan.push(t.pAddr); }
  }
  return gedaan;
}

/* ============ ECHTE TEKSTHERKENNING ============
   Buiten de zandbak van claude.ai kan de app doen wat professionele scanners doen:
   een volwaardige tekstherkenner laden (Tesseract, gratis, in de browser) en als
   tweede mening een dienst aanroepen (OCR.space, gratis sleutel). Wij doen wat wij
   het best kunnen — de kaart uitknippen, rechtdraaien, vergroten — en zij lezen de
   letters. Wat terugkomt gaat door dezelfde controles als geplakte tekst. */
function ocrSleutel(){ try{ return (localStorage.getItem("atlas-ocrkey")||"").trim(); }catch(e){ return ""; } }
function kaartVoorOcr(img){
  var uit=[], rect=null;
  try{ rect=vindKaart(img); }catch(e){ rect=null; }
  var basis = rect ? snijUit(img,rect,2000) : img;
  if(rect && rect.staand){ uit.push(turnImage(basis,90)); uit.push(turnImage(basis,270)); }
  else {
    var c=document.createElement("canvas"), sc=Math.min(1,2200/basis.width);
    c.width=Math.round(basis.width*sc); c.height=Math.round(basis.height*sc);
    c.getContext("2d").drawImage(basis,0,0,c.width,c.height);
    uit.push(c);
    if(!rect && img.height>img.width*1.15){ uit.push(turnImage(c,90)); uit.push(turnImage(c,270)); }
  }
  return uit;
}
/* Grijs maken en het contrast oprekken: het donkerste procent wordt zwart, het
   lichtste wit. Tesseract houdt daarvan. */
function contrastGrijs(c){
  var k=document.createElement("canvas"); k.width=c.width; k.height=c.height;
  var x=k.getContext("2d"); x.drawImage(c,0,0);
  var d=x.getImageData(0,0,k.width,k.height), a=d.data, hist=new Array(256).fill(0), i, g;
  for(i=0;i<a.length;i+=4){ g=(a[i]*0.299+a[i+1]*0.587+a[i+2]*0.114)|0; a[i]=g; hist[g]++; }
  var N=k.width*k.height, lo=0, hi=255, tel=0;
  for(i=0;i<256;i++){ tel+=hist[i]; if(tel>N*0.01){ lo=i; break; } }
  tel=0; for(i=255;i>=0;i--){ tel+=hist[i]; if(tel>N*0.01){ hi=i; break; } }
  var span=Math.max(1,hi-lo);
  for(i=0;i<a.length;i+=4){ g=Math.max(0,Math.min(255,Math.round((a[i]-lo)*255/span))); a[i]=a[i+1]=a[i+2]=g; }
  x.putImageData(d,0,0); return k;
}
/* Welke lezing is beter? Die met een strook of nummer erin; anders de langste. */
function bruikbaarder(nieuw,oud){
  if(!oud) return true;
  var nS=!!plakMRZ(nieuw), oS=!!plakMRZ(oud);
  if(nS!==oS) return nS;
  var nR=plakRegels(nieuw), oR=plakRegels(oud);
  var nN=!!(licNummerUit(nR)||voorkantUitRegels(nR).birth), oN=!!(licNummerUit(oR)||voorkantUitRegels(oR).birth);
  if(nN!==oN) return nN;
  return nieuw.replace(/\s/g,"").length>oud.replace(/\s/g,"").length;
}
async function tesseractTekst(canvas,melden){
  var tekst=await ocrLees(canvas,melden);
  return tekst||"";
}
async function ocrSpaceTekst(canvas,melden){
  var key=ocrSleutel(); if(!key) return "";
  if(melden) melden("ocrspace",0);
  var c=canvas; if(c.width>1800){ var k=document.createElement("canvas"), sc=1800/c.width;
    k.width=1800; k.height=Math.round(c.height*sc); k.getContext("2d").drawImage(c,0,0,k.width,k.height); c=k; }
  var data=c.toDataURL("image/jpeg",0.85);
  var fd=new FormData();
  fd.append("apikey",key); fd.append("base64Image",data); fd.append("OCREngine","2");
  fd.append("scale","true"); fd.append("detectOrientation","true"); fd.append("language","fre");
  var ctl=new AbortController(), tm=setTimeout(function(){ ctl.abort(); },25000);
  try{
    var r=await fetch("https://api.ocr.space/parse/image",{ method:"POST", body:fd, signal:ctl.signal });
    var j=await r.json();
    var pr=(j&&j.ParsedResults)||[];
    return pr.map(function(x){ return x.ParsedText||""; }).join("\n");
  }catch(e){ return ""; }
  finally{ clearTimeout(tm); }
}
/* Probeert de echte herkenners op deze foto. Geeft de lijst van gevulde velden
   terug, of een lege lijst als er niets bruikbaars uit kwam. */
async function externLezen(blob,melden,opts){
  opts=opts||{};
  var img; try{ img=await blobImg(blob); }catch(e){ return { gedaan:[], tekst:"" }; }
  var kandidaten=kaartVoorOcr(img), alles="";
  /* Hebben we het nummer al uit een regel met controlecijfer, dan zoeken we hier
     alleen nog de datum. Dan is één goede lezing genoeg en hoeven we niet alle
     uitsneden af te gaan — dat scheelt de verhuurder een halve minuut wachten. */
  if(opts.alleenDatum) kandidaten=kandidaten.slice(0,2);
  var heeftTess=await needLib("ocr");
  if(heeftTess){
    /* Elke uitsnede twee keer: zoals hij is, en als contrastrijke grijsversie.
       Een glanzende kaart met licht patroon leest vaak beter in die tweede. */
    var lijst=[];
    kandidaten.forEach(function(c){ lijst.push(c); lijst.push(contrastGrijs(c)); });
    for(var i=0;i<lijst.length;i++){
      var tx=await tesseractTekst(lijst[i],melden);
      if(tx && bruikbaarder(tx,alles)) alles=tx;
      if(opts.alleenDatum && datumsUit(alles).length) break;
      if(plakMRZ(alles) || licNummerUit(plakRegels(alles))) break;
    }
  }
  var gedaan = alles ? verwerkTekst(alles) : [];
  if(heeftTess && !alles && !OCRFOUT) OCRFOUT="tesseract gaf geen tekst terug";
  if(!gedaan.length && ocrSleutel()){
    var tx2=await ocrSpaceTekst(kandidaten[0],melden);
    if(tx2){ alles=tx2; gedaan=verwerkTekst(tx2); }
  }
  /* Wat de herkenner las, zetten we in het plakvak. Zo ziet de verhuurder het
     — en kan hij een verkeerd teken verbeteren en het alsnog laten verwerken.
     En als het misgaat, zie ik precies wat er gelezen werd. */
  if(alles && $("plakText")){ $("plakText").value=alles; if(!gedaan.length && $("plakMsg")) $("plakMsg").textContent=T().plakGelezen; }
  return { gedaan:gedaan, tekst:alles, tess:heeftTess };
}
/* WELK DOCUMENT IS DIT?
   Het vakje waarin de foto belandt is een hint, geen waarheid. Wat er werkelijk op
   de kaart staat beslist waar de gegevens heen gaan. Anders komt de vervaldatum van
   een identiteitskaart in het rijbewijsvak terecht — en dat is erger dan een leeg
   veld, want de verhuurder ziet het niet en zet het zo op het contract. */
function voorkantUitRegels(regels){
  var o={}, lijst=regels.map(function(r){ return r.tekst; }), i;
  var nu=new Date().getUTCFullYear();
  for(i=0;i<lijst.length;i++){
    var r=lijst[i];
    var m=r.match(/N[EÉ6È]E?\s*LE\s*[:.]?\s*([0-3]?\d[\.\/\-][01]?\d[\.\/\-](?:19|20)\d\d)/i);
    if(m && !o.birth){ var d=datumsUit(m[1])[0]; if(d && d.jaar<=nu-16) o.birth=d.iso;
      /* de naam staat op de regels erboven: hoofdletters, geen cijfers */
      var namen=[];
      for(var k=i-1;k>=0 && namen.length<2;k--){
        var q=lijst[k].replace(/[^A-Z\s\-]/g,"").replace(/\s+/g," ").trim();
        if(q.length>=3 && q.length<=30 && !/ROYAUME|MAROC|CARTE|NATIONAL|IDENTIT|CNIE/.test(q)) namen.unshift(q);
        else if(namen.length) break;
      }
      /* Op de voorkant staat de voornaam boven de familienaam (YOUSSRI / ELOUARRAT).
         Overal elders in Atlas — strook, contract — komt de familienaam eerst.
         Omdraaien, anders staat de voornaam op het contract bij "Nom". */
      if(namen.length) o.name = namen.length===2 ? (namen[1]+" "+namen[0]) : namen.join(" ");
    }
    var v=r.match(/VALABLE\s*JUSQU.{0,4}\s*([0-3]?\d[\.\/\-][01]?\d[\.\/\-](?:19|20)\d\d)/i);
    if(v && !o.expiry){ var d2=datumsUit(v[1])[0]; if(d2 && d2.jaar>=nu-1) o.expiry=d2.iso; }
    var n=r.match(/\b([A-Z]{1,2}[0-9]{4,7})\b/);
    if(n && !o.number && CINNR.test(n[1])) o.number=n[1];
  }
  return o;
}
function soortUitRegels(regels){
  var t=(regels||[]).map(function(r){ return r.tekst; }).join(" ").toUpperCase();
  if(!t) return "";
  var lic=0, id=0;
  if(/N[EÉ6È]E?\s*LE\b|VALABLE\s*JUSQU/.test(t)) id+=3;
  if(/PERMIS|CONDUIRE|DRIVING|LICEN[CS]E/.test(t)) lic+=3;
  if(/CATEGOR|CLASSE/.test(t)) lic+=1;
  if(/CARTE\s*NATIONAL|IDENTIT|CNIE|BITAQA|PASSEPORT|PASSPORT/.test(t)) id+=3;
  if(/<<</.test(t)) id+=3;                               /* de strook zelf in beeld */
  if(/\bIDMAR|\bID[A-Z]{3}[A-Z0-9]/.test(t)) id+=3;
  if(lic>=3 && lic>id) return "licence";
  if(id>=3 && id>lic) return "id";
  return "";
}
function lijktAchterkant(res){
  if(!res || !res.regels || res.regels.length<3) return false;
  var raak=0;
  res.regels.forEach(function(r){
    var s=r.tekst.trim();
    if(/CATEGOR|CLASSE/i.test(s)) raak+=2;
    if(/^(A1|A2|A|B1|B|BE|C1|CE|C|D1|DE|D|EB|EC|ED)([\s\.\-]|$)/.test(s)) raak++;
  });
  return raak>=3;
}
/* Laten zien wat er gelezen is, vlak onder de foto van het rijbewijs. Namen vullen
   we niet zelf in — die bieden we aan, want een naam heeft geen controlegetal. */
function toonLicUit(res,D){
  var t=T(), w=$("licUit"); if(!w) return;
  res=res||{};
  w.hidden=false; w.innerHTML="";
  w.appendChild(Object.assign(el("div"),{textContent:t.licUitH,style:"font-weight:700;font-size:14px"}));
  w.appendChild(Object.assign(el("p","fine"),{textContent:t.licUitP,style:"margin:2px 0 8px"}));
  var box=el("div","mrzdemo");
  box.style.cssText="text-align:left;white-space:pre-wrap;word-break:break-word";
  box.textContent=(res.regels||[]).map(function(r){ return r.tekst; }).join("\n")||t.licLeeg;
  w.appendChild(box);
  /* Lukt het niet, dan wil ik kunnen zien waaróm het niet lukt. Eén knop, en de
     verhuurder kan het doorsturen in plaats van "hij doet het niet". */
  if(D){
    var reg=[];
    reg.push("foto     : "+(D.img||"-"));
    reg.push("hoeken   : "+(D.hoeken||"-"));
    reg.push("kaart    : "+(D.kaart||"-"));
    reg.push("tesseract: "+(OCRFOUT||(window.Tesseract?"geladen":"niet geprobeerd")));
    reg.push("ocr.space: "+(ocrSleutel()?"sleutel aanwezig":"geen sleutel"));
    reg.push("scheef   : "+(D.scheef||"0")+" graden");
    if(D.licRegel) reg.push("D1-regel : "+D.licRegel+(D.licNaam?" naam="+D.licNaam:""));
    if(D.fout) reg.push("fout     : "+D.fout);
    (D.stappen||[]).forEach(function(s){ reg.push("  "+s); });
    reg.push("gelezen  : nr="+(res.number||"-")+" geldig="+(res.expiry||"-")+" geboren="+(res.birth||"-"));
    reg.push("--- regels ---");
    (res.regels||[]).forEach(function(r){ reg.push(r.tekst+"   ["+r.score.toFixed(2)+"]"); });
    var rap=reg.join("\n");
    var kn=el("button","link",t.licRap); kn.type="button"; kn.style.cssText="margin-top:8px";
    var vak=el("div"); vak.hidden=true; vak.style.marginTop="8px";
    var pre=el("div","mrzdemo"); pre.style.cssText="text-align:left;white-space:pre-wrap;word-break:break-word";
    pre.appendChild(Object.assign(document.createElement("code"),{textContent:rap}));
    var kop=el("button","btn ghost sm",t.diagCopy); kop.type="button"; kop.style.cssText="margin-top:8px;width:100%";
    kop.addEventListener("click",function(){
      try{ navigator.clipboard.writeText(rap); kop.textContent=t.diagCopied; }
      catch(e){ var ta=document.createElement("textarea"); ta.value=rap; document.body.appendChild(ta); ta.select();
        try{ document.execCommand("copy"); kop.textContent=t.diagCopied; }catch(e2){} ta.remove(); }
    });
    vak.appendChild(pre); vak.appendChild(kop);
    kn.addEventListener("click",function(){ vak.hidden=!vak.hidden; });
    w.appendChild(kn); w.appendChild(vak);
  }
  if(res.expiryGok){
    var db=el("button","btn ghost sm",t.licDatGok(res.expiryGok)); db.type="button"; db.style.cssText="margin-top:8px;width:100%";
    db.addEventListener("click",function(){ var f=$("cvLicExp"); f.value=res.expiryGok; markCheck("cvLic"); f.focus(); });
    w.appendChild(db);
  }
  if(res.numberGok){
    var nb=el("button","btn ghost sm",t.licNrGok(res.numberGok)); nb.type="button"; nb.style.cssText="margin-top:8px;width:100%";
    nb.addEventListener("click",function(){ var f=$("cvLic"); f.value=res.numberGok; markCheck("cvLic"); f.focus(); });
    w.appendChild(nb);
  }
  (res.namen||[]).forEach(function(n){
    if(!n || n.length<3) return;
    var b=el("button","btn ghost sm",t.licNaam(n)); b.type="button"; b.style.cssText="margin-top:8px;width:100%";
    b.addEventListener("click",function(){ var f=$("cvName"); f.value=n; markCheck("cvName"); f.focus(); });
    w.appendChild(b);
  });
}
async function voorkantLezen(blob,storedKey,done){
  var t=T(), p=$("scanP"), bron=CROPSRC||blob;
  var kk=renameScan(storedKey,"cin"); paintScans(); showDiag(null);
  p.textContent=t.ocrExtern;
  var ex=await externLezen(bron,function(f,pc){ p.textContent=t.ocrExtern+(pc?" "+Math.round(pc*100)+"%":""); });
  if(ex.gedaan.length){ done(t.ocrExternOk(ex.gedaan.join(", "))); return; }
  /* Niets leesbaars: het adres-stukje tonen zodat overtypen makkelijk is, en het
     kader klaarzetten. */
  try{ var bnd=await adresBand(bron); if(bnd) toonAdresBand(bnd,""); }catch(e){}
  showCrop(bron,kk);
  done(ex.tess ? t.voorNiets : t.voorGeenLezer);
}
/* Claude kon de foto niet lezen: één snelle poging met de herkenning die in de browser
   zelf zit (kost niets, duurt geen seconde). Lukt dat niet, dan is de foto gewoon bewaard. */
async function mrzFallback(blob,storedKey,done,code){
  var t=T(), hit=null, p=$("scanP"), D={};
  /* Een rijbewijs heeft geen machineleesbare strook — niet het Marokkaanse en niet
     de meeste andere. Eindeloos zoeken naar iets dat er niet is kost de verhuurder
     alleen tijd en geeft hem het gevoel dat de app stuk is. Eén korte poging voor
     de uitzonderingen die er wél een hebben, en anders meteen eerlijk zijn. */
  var isLic = pickedDoc()==="licence";
  /* Een rijbewijs heeft er geen. Zoeken naar een strook die er niet is kost alleen
     tijd: we gaan meteen de gedrukte tekst lezen. */

function carPL(c){
  var rents=RENTALS.filter(function(r){ return live(r) && r.vehicleId===c.id && r.depart; });
  /* Opbrengst is wat er binnenkwam, niet wat er afgesproken werd. Anders zegt
     dit scherm iets anders dan de kas, en dan klopt er ergens iets niet. */
  var all=RENTALS.filter(function(r){ return r.vehicleId===c.id; });
  /* Bij een lopende verhuur is de borg geen omzet. Bij een geannuleerde is wat
     je van de borg mocht houden dat wel. */
  var rev=all.reduce(function(a,r){ return a+paidRent(r)+(r.cancelled?paidCaution(r):0); },0);
  var due=all.filter(live).reduce(function(a,r){ return a+dueRent(r); },0);
  var days=rents.reduce(function(a,r){ return a+(r.days||0); },0);
  var ex=EXP.filter(function(e){ return e.vehicleId===c.id; });
  var cost=ex.reduce(function(a,e){ return a+(e.amount||0); },0);
  var since=c.purchaseDate?Math.max(1,dayDiff(c.purchaseDate,today())):null;
  return { rev:rev, due:due, cost:cost, net:rev-cost, days:days, util: since?Math.round(days/since*100):null, loanLeft:(c.loanMonthly||0)*(c.loanMonthsLeft||0), ex:ex };
}

/* Een klant stuurt zelden een nette foto. Vaak is het een PDF van een scanner, of
   een pagina uit een e-mail. We zetten elke bladzijde om in een scherp beeld en

async function pdfPages(file,max){

/* ============ GEWONE TEKST LEZEN ============
   De machineleesbare strook lees ik zelf: vaste vakjes, 37 tekens, controlecijfers.
   Gedrukte tekst — een adres, een rijbewijsnummer — is een heel ander vak: evenredige
   letters, geen vaste breedte, geen controle. Daar halen we een echte tekstherkenner
   bij. Die wordt pas gedownload als de verhuurder erom vraagt, want het is een flink
   bestand; daarna zit hij in de browser en gaat het snel. Lukt het laden niet, dan
   zeggen we dat en blijft het veld gewoon leeg. */
var OCRW=null, OCRBEZIG=false, OCRFOUT="";
async function ocrWorker(melden){
  if(OCRW) return OCRW;
  if(!await needLib("ocr")){ OCRFOUT="tesseract niet geladen"; return null; }
  var T=window.Tesseract;
  var opt={ logger:function(m){ if(melden && m && m.status) melden(m.status, m.progress||0); } };
  /* Tesseract 5: createWorker(taal, motor, opties). De oude vorm createWorker(opties)
     bestaat nog in versie 4 — daarom proberen we eerst de nieuwe en dan de oude.
     (Op function.length afgaan werkt niet: standaardwaarden tellen niet mee.) */
  /* Frans erbij: de opdruk op een Marokkaanse kaart is Frans ("Né le", "Valable
     jusqu'au"). Lukt dat pakket niet te laden, dan alleen Engels. */
  try{ OCRW=await T.createWorker("fra+eng",1,opt); return OCRW; }catch(e0){}
  try{ OCRW=await T.createWorker("eng",1,opt); return OCRW; }catch(e1){}
  try{
    OCRW=await T.createWorker(opt);
    await OCRW.loadLanguage("eng"); await OCRW.initialize("eng");
    return OCRW;
  }catch(e2){ OCRFOUT="tesseract start mislukt: "+String((e2&&e2.message)||e2); OCRW=null; return null; }
}
async function ocrLees(canvas,melden,witlijst){
  var w=await ocrWorker(melden); if(!w) return null;
  try{
    /* De tekenlijst geldt voor de hele werker en blijft staan tot je hem weghaalt.
       Zetten we hem voor de strook (alleen hoofdletters en « < »), dan leest de
       volgende oproep — het adres — ineens zonder spaties. Dus: elke keer expliciet
       zetten, ook als we hem niet nodig hebben. */
    if(w.setParameters) { try{ await w.setParameters({ tessedit_char_whitelist: witlijst||"" }); }catch(e){} }
    var r=await w.recognize(canvas);
    return (r&&r.data&&typeof r.data.text==="string") ? r.data.text : "";
  }catch(e){ OCRFOUT="tesseract lezen mislukt: "+String((e&&e.message)||e); return null; }
}

   geen adres — dat vullen we dus niet in. */
var ADRESSTERK=/\b(RUE|AV|AVENUE|BD|BOULEVARD|LOT|IMM|APPT|APT|RES|RTE|ZNK|LOTISSEMENT|HAY|QUARTIER|RESIDENCE|IMMEUBLE|APPARTEMENT|ETAGE|DOUAR|BLOC|SECTEUR|CITE|VILLA|DERB|ZANKAT|CHARIA|TARIK|ROUTE|MEDINA|OPERATION|ANGLE|PLACE|CENTRE)\b/;
var ADRESWOORD=/\b(RUE|AV|AVENUE|BD|BOULEVARD|LOT|LOTISSEMENT|LOTS|HAY|QUARTIER|QU|RESIDENCE|RES|IMM|IMMEUBLE|APPT|APT|APPARTEMENT|ETAGE|ETG|N[°O]?|NR|DOUAR|BLOC|SECTEUR|CITE|VILLA|DERB|ZANKAT|CHARIA|TARIK|ROUTE|RTE|KM|CENTRE|VILLE|MEDINA|OPERATION|OP|ANGLE|PLACE|PL)\b/;
function adresAchtig(t){
  if(!t) return false;
  var s=String(t).trim().toUpperCase();
  /* een adres bevat vrijwel altijd een straat- of wijkwoord; zonder dat is het
     losse tekst die toevallig een cijfer bevat */
  if(!ADRESWOORD.test(s)) return false;
  /* "N°", "NR", "KM" en dergelijke zijn te kort om op zichzelf een adres te
     bewijzen — die staan zo in elke verkeerd gelezen regel. Er moet minstens één
     écht adreswoord bij staan. */
  if(!ADRESSTERK.test(s)) return false;
  /* Losse letters tussen de woorden ("= G 76 IG I MOINS") zijn leesfouten, geen
     adres. Het grootste deel van de tekst moet uit echte woorden bestaan. */
  var los=(s.match(/(^|\s)[A-Z0-9](\s|$)/g)||[]).length;
  if(los>2) return false;
  if(/[=_|\\\/]/.test(s)) return false;
  if(s.length<10 || s.length>70) return false;
  var vraag=(s.match(/\?/g)||[]).length; if(vraag>s.length*0.08) return false;
  var letters=(s.match(/[A-Z]/g)||[]).length; if(letters<8) return false;
  if(!/[A-Z]{4,}/.test(s)) return false;          /* minstens één echt woord */
  if(!/\d/.test(s)) return false;                 /* en een huisnummer */
  var woorden=s.split(/\s+/).filter(function(w){ return /^[A-Z]{3,}$/.test(w); });
  if(woorden.length<2) return false;
  /* en minstens twee woorden van vier letters: drieletterige stukjes zijn net zo
     goed toevallige ruis */
  if(s.split(/\s+/).filter(function(w){ return /^[A-Z]{4,}$/.test(w); }).length<2) return false;
  var rommel=(s.match(/[^A-Z0-9 ]/g)||[]).length;
  if(rommel>s.length*0.15) return false;
  return true;
}
function adresUitRegels(regels){
  var ruw=adresUitRegelsRuw(regels);
  return ruw?adresOpschonen(ruw):"";
}
/* Een adres mag geen strookrommel zijn: geen < of /, geen lange mengsels van letters
   en cijfers zoals in de strook. Een adres zonder huisnummer (DOUAR ...) mag wel. */
function adresGeloofwaardig(a){
  var s=String(a||"").toUpperCase().trim(); if(s.length<6) return false;
  if(/[<\/=|_]/.test(s)) return false;
  if(s.split(/\s+/).some(function(w){ return w.length>=9 && /\d/.test(w) && /[A-Z]/.test(w); })) return false;
  if(/I[DO0]MAR/.test(s.replace(/\s/g,""))) return false;
  if((s.match(/\d/g)||[]).length > s.length*0.3) return false;
  return s.split(/\s+/).filter(function(w){ return /^[A-Z]{3,}$/.test(w); }).length>=2;
}
function adresUitRegelsRuw(regels){
  if(!regels || !regels.length) return "";
  var goed=regels.filter(function(r){ return r.score>=0.6 && r.tekst.replace(/[^A-Z0-9]/g,"").length>=6; });
  var gemerkt=goed.filter(function(r){ return /ADRE|ADDRESS/i.test(r.tekst); })[0];
  if(gemerkt){ var na=gemerkt.tekst.replace(/^.*?ADRE\w*\s*[:.]?\s*/i,"").trim(); if(adresGeloofwaardig(na)) return na; }
  var kand=goed.filter(function(r){ return adresAchtig(r.tekst); })
               .sort(function(a,b){ return b.tekst.length-a.tekst.length; })[0];
  return kand?kand.tekst.trim():"";
}
/* Uit de herkende tekst halen we de regel die er als een adres uitziet. */
/* Een tekstherkenner leest de Arabische opdruk en het woord "Adresse" ervoor als
   rommel mee ("Jarsss LOTSSEMENT..."), en laat in een lang woord wel eens een
   letter vallen. Beide zijn te herstellen zonder te gokken: we beginnen het adres
   bij het eerste echte adreswoord, en een woord dat op één letter na een bekend
   adreswoord is, zetten we recht. Verzinnen doen we niets — wat we niet herkennen
   laten we staan zoals het gelezen is. */
var ADRESLIJST=["LOTISSEMENT","RESIDENCE","IMMEUBLE","APPARTEMENT","QUARTIER","BOULEVARD",
  "AVENUE","SECTEUR","OPERATION","MEDINA","ZANKAT","CHARIA","DOUAR","ROUTE","ANGLE","PLACE",
  "CENTRE","VILLA","DERB","TARIK","BLOC","CITE","ETAGE","RUE","HAY"];
function afstand1(a,b){
  if(Math.abs(a.length-b.length)>1) return false;
  var i=0,j=0,fout=0;
  while(i<a.length && j<b.length){
    if(a[i]===b[j]){ i++; j++; continue; }
    if(++fout>1) return false;
    if(a.length>b.length) i++; else if(b.length>a.length) j++; else { i++; j++; }
  }
  if(i<a.length || j<b.length) fout++;
  return fout<=1;
}
function adresOpschonen(s){
  if(!s) return "";
  var t=String(s).toUpperCase().replace(/[^A-Z0-9°\/\-\s]/g," ").replace(/\s+/g," ").trim();
  var w=t.split(" ").map(function(x){
    if(x.length<4) return x;
    for(var i=0;i<ADRESLIJST.length;i++) if(x!==ADRESLIJST[i] && afstand1(x,ADRESLIJST[i])) return ADRESLIJST[i];
    return x;
  });
  /* alles vóór het eerste echte adreswoord weggooien: dat is de opdruk van de kaart */
  for(var k=0;k<w.length;k++) if(ADRESSTERK.test(w[k])){ w=w.slice(k); break; }
  return w.join(" ").replace(/\s+/g," ").trim();
}
function adresUitTekst(tekst){
  if(!tekst) return "";
  var regels=tekst.split("\n").map(function(r){ return r.replace(/\s+/g," ").trim(); }).filter(function(r){ return r.length>6; });
  var gemerkt=regels.filter(function(r){ return /ADRE|ADRESS|ADDRESS/i.test(r); })[0];
  if(gemerkt) return adresOpschonen(gemerkt.replace(/^.*?ADRE\w*\s*[:.]?\s*/i,"").trim());
  /* anders: de langste regel met letters én een huisnummer */
  var kandidaat=regels.filter(function(r){ return /[A-Za-z]{4,}/.test(r) && /\d/.test(r); })
                      .sort(function(a,b){ return b.length-a.length; })[0];
  return kandidaat?adresOpschonen(kandidaat):"";
}
/* En uit een rijbewijs: het nummer en de datums. */
function rijbewijsUitTekst(tekst){
  var o={};
  if(!tekst) return o;
  var t=tekst.replace(/[|]/g,"/");
  var nr=t.match(/\b\d{1,2}\s*\/\s*\d{4,8}\b/);
  if(nr) o.number=nr[0].replace(/\s/g,"");
  if(!o.number){ var alt=t.match(/\b[A-Z]{1,3}\d{5,10}\b/); if(alt) o.number=alt[0]; }
  var nu=new Date().getUTCFullYear(), gevonden=[];
  var re=/\b(\d{2})[\/.\-](\d{2})[\/.\-](\d{4})\b/g, m;
  while((m=re.exec(t))) gevonden.push({ iso:m[3]+"-"+m[2]+"-"+m[1], jaar:Number(m[3]) });
  var toekomst=gevonden.filter(function(d){ return d.jaar>=nu-1 && d.jaar<=nu+30; });
  if(toekomst.length) o.expiry=toekomst.sort(function(a,b){ return b.jaar-a.jaar; })[0].iso;
  return o;
}
/* Een rijbewijs heeft geen machineleesbare strook, maar wél vaak een streepjescode
   op de achterkant — het Marokkaanse permis en veel Europese kaarten. Die is exact
   te lezen: geen letterherkenning, geen giswerk. Chrome kan dit zelf, zonder dat er
   iets gedownload hoeft te worden. */
async function readBarcodes(blob){
  if(!("BarcodeDetector" in window)) return [];
  var soorten=["pdf417","qr_code","data_matrix","aztec","code_128","code_39","itf"];
  var kan=[];
  try{ kan=await window.BarcodeDetector.getSupportedFormats(); }catch(e){ kan=soorten; }
  var lijst=soorten.filter(function(f){ return kan.indexOf(f)>=0; });
  if(!lijst.length) return [];
  var det;
  try{ det=new window.BarcodeDetector({formats:lijst}); }catch(e){ return []; }
  var vol=await new Promise(function(res,rej){
    var u=URL.createObjectURL(blob), m=new Image();
    m.onload=function(){ URL.revokeObjectURL(u); res(m); };
    m.onerror=function(){ URL.revokeObjectURL(u); rej(new Error("img")); }; m.src=u;
  });
  /* Eerst verkleinen. Een telefoonfoto is twaalf miljoen beeldpunten; die vier keer
     draaien en doorzoeken laat de browser seconden stilstaan, en het lijkt dan alsof
     de app niets doet. Een streepjescode is op 1600 punten breed prima leesbaar. */
  var img=vol;
  if(vol.width>1600){
    var kc=document.createElement("canvas");
    kc.width=1600; kc.height=Math.round(vol.height*1600/vol.width);
    kc.getContext("2d").drawImage(vol,0,0,kc.width,kc.height);
    img=kc;
  }
  var uit=[], t0=Date.now();
  var standen=[0,90,180,270];
  for(var i=0;i<standen.length;i++){
    if(Date.now()-t0>5000) break;
    try{
      var src = standen[i]? turnImage(img,standen[i]) : img;
      var bm=await createImageBitmap(src);
      var hits=await det.detect(bm);
      for(var j=0;j<hits.length;j++) if(hits[j].rawValue) uit.push({ tekst:hits[j].rawValue, soort:hits[j].format });
      if(uit.length) break;
    }catch(e){}
  }
  return uit;
}
/* Uit de inhoud van zo'n code halen we wat we kunnen gebruiken: een rijbewijsnummer
   in de Marokkaanse vorm (bijvoorbeeld 07/118422) en een datum. Wat we niet zeker
   weten, laten we leeg — de ruwe inhoud tonen we er wel bij. */
function uitBarcode(tekst){
  var o={ raw:tekst };
  var nr=tekst.match(/\b\d{1,2}\s*\/\s*\d{5,8}\b/);
  if(nr) o.number=nr[0].replace(/\s/g,"");
  if(!o.number){ var alt=tekst.match(/\b[A-Z]{0,2}\d{6,12}\b/); if(alt) o.number=alt[0]; }
  var dl=tekst.match(/\b(\d{2})[\/.\-](\d{2})[\/.\-](\d{4})\b/g)||[];
  var jaren=dl.map(function(d){ var m=d.match(/(\d{2})[\/.\-](\d{2})[\/.\-](\d{4})/); return { iso:m[3]+"-"+m[2]+"-"+m[1], jaar:Number(m[3]) }; });
  var nu=new Date().getUTCFullYear();
  var toekomst=jaren.filter(function(d){ return d.jaar>=nu-2 && d.jaar<=nu+25; });
  if(toekomst.length) o.expiry=toekomst[toekomst.length-1].iso;
  return o;
}
/* QR lezen kan ook zonder bibliotheek: sommige browsers kunnen het zelf. */
async function readQR(canvas,ctx){
  if("BarcodeDetector" in window){
    try{
      var det=new window.BarcodeDetector({formats:["qr_code"]});
      var bm=await createImageBitmap(canvas), hits=await det.detect(bm);
      if(hits&&hits.length&&hits[0].rawValue) return hits[0].rawValue;
    }catch(e){}
  }
  if(await needLib("qrread")){
    try{
      var d=ctx.getImageData(0,0,canvas.width,canvas.height);
      var code=window.jsQR(d.data,canvas.width,canvas.height);
      if(code&&code.data) return code.data;
    }catch(e){}
  }
  return null;
}

/* Marokkaanse agentschappen werken allemaal met hetzelfde papieren contract:
   links de huurder, rechts het voertuig en de facturatie, met de franchise en de
   boorddocumenten erbij. Atlas drukt precies die vorm af, zodat de verhuurder zijn
   eigen document herkent en niets hoeft uit te leggen aan de klant of de politie. */
function nomPrenom(naam){
  var d=String(naam||"").trim().split(/\s+/).filter(Boolean);
  if(d.length<2) return { nom:d[0]||"", prenom:"" };
  /* In de strook van een identiteitskaart staat de achternaam vooraan, en zo
     vullen alle scans het naamveld ook. Marokkaanse achternamen beginnen vaak met
     een voorzetsel (EL FASSI, BEN ALI, AIT TALEB, OULD ...): dat hoort bij de
     achternaam en mag niet als voornaam op het contract komen. */
  var voor=/^(EL|AL|BEN|BENT|BNOU|BOU|ABOU|ABDEL|AIT|A\u00cfT|ID|OU|OULD|OULAD|SIDI|MOULAY|LALLA|DE|DA|DI|DU|LA|LE|VAN|VON|DOS|DEL)$/i;
  var n=1; while(n<d.length-1 && voor.test(d[n-1])) n++;
  return { nom:d.slice(0,n).join(" "), prenom:d.slice(n).join(" ") };
}
function uurVan(iso){
  if(!iso) return "";
  var d=new Date(iso); if(isNaN(d.getTime())) return "";
  function tw(n){ return (n<10?"0":"")+n; }
  return tw(d.getHours())+":"+tw(d.getMinutes());
}
function geldigNu(d){ return !!(d && String(d).slice(0,10)>=today()); }
/* Op een contract hoort een datum voluit: 10/08/2030, niet 10-08-30. Een jaartal
   van twee cijfers leest bij een politiecontrole als een fout. */
function dNum(d){ if(!d) return ""; var x=String(d).slice(0,10).split("-"); return x.length===3?(x[2]+"/"+x[1]+"/"+x[0]):String(d); }
function cRij(k,v){
  var tekst=(v===null||v===undefined||v==="")?"—":String(v);
  return '<div class="rij"><span>'+esc(k)+'</span><b>'+esc(tekst)+'</b></div>';
}
/* Zelfde regel, maar met HTML als waarde — nodig voor de kentekenplaat, die in
   <bdi> moet staan omdat de Arabische letter anders de volgorde omdraait. */

/* ============ BETALINGEN EN KAS ============
   Tot nu toe wist Atlas alleen wat er afgesproken was. Hier komt bij wat er echt
   betaald is, zodat de kassa 's avonds klopt. */
function pays(r){ return (r&&r.payments)||[]; }
function paidRent(r){ return pays(r).filter(function(x){ return x.kind!=="caution"; }).reduce(function(a,x){ return a+(Number(x.amount)||0); },0); }
function paidCaution(r){ return pays(r).filter(function(x){ return x.kind==="caution"; }).reduce(function(a,x){ return a+(Number(x.amount)||0); },0); }
function dueRent(r){ return Math.max(0,(Number(r.total)||0)-paidRent(r)); }
function dueCaution(r){ return Math.max(0,(Number(r.caution)||0)-paidCaution(r)); }

/* Alle geldbewegingen van één dag: binnen uit betalingen, buiten uit teruggegeven borg. */
/* Alle verhuren, ook geannuleerde: geld dat gisteren binnenkwam mag vandaag niet
   uit de geschiedenis verdwijnen omdat de boeking is afgezegd. Een negatief
   bedrag is geld dat je teruggaf. */
function cashMoves(day){
  var out=[];
  RENTALS.forEach(function(r){
    pays(r).forEach(function(x){
      var a=Number(x.amount)||0;
      /* alleen het etiket: een negatief bedrag bij een geannuleerde verhuur is
         geen borgteruggave maar een terugbetaling */
      var k = (a<0 && r.cancelled) ? "cancelback" : x.kind;
      if((x.date||"")===day) out.push({ r:r, dir:a<0?"out":"in", kind:k, amount:Math.abs(a), method:x.method||"cash", note:x.note||"", id:x.id });
    });
    if(r.released && r.releasedAt===day){
      var back=(r.cautionReturned!=null)?Number(r.cautionReturned):Number(r.caution)||0;
      if(back>0) out.push({ r:r, dir:"out", kind:"refund", amount:back, method:r.refundMethod||"cash", note:"" });
    }
  });
  return out;
}
var cashDate=null;
function renderCash(){
  var t=T(); if(!cashDate) cashDate=today();
  $("cashDay").textContent=dLong(cashDate);
  var mv=cashMoves(cashDate);
  var inn=mv.filter(function(m){ return m.dir==="in"; }).reduce(function(a,m){ return a+m.amount; },0);
  var uit=mv.filter(function(m){ return m.dir==="out"; }).reduce(function(a,m){ return a+m.amount; },0);
  function per(meth){ return mv.reduce(function(a,m){ return m.method===meth?a+(m.dir==="in"?m.amount:-m.amount):a; },0); }
  $("cashNet").textContent=dh(inn-uit); $("cashIn").textContent=dh(inn); $("cashOut").textContent=dh(uit); $("cashOut").className=uit>0?"bad":"";
  $("cashCash").textContent=dh(per("cash")); $("cashCard").textContent=dh(per("card"));
  var box=$("cashRows"); box.innerHTML="";
  if(!mv.length) box.appendChild(el("div","none",t.cashEmpty));
  mv.forEach(function(m){
    var c=car(m.r.vehicleId), row=el("div","lrow");
    var w=el("div","who"); w.appendChild(el("b",null,m.r.clientName));
    var cl=el("div","car"); cl.appendChild(el("span",null,c.model+" · "+m.r.code));
    cl.appendChild(el("span",null,"· "+t.payKinds[m.kind]+" · "+t.payMethods[m.method]));

/* ============ BETALEN ZONDER TERMINAL ============

  return uit.sort(function(x,y){ return boeteTermijn(x.b).localeCompare(boeteTermijn(y.b)); });

async function bewaarBoete(r,b){
